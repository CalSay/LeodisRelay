<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developments Hub Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Relay · Leodis Developments · hub concepts, 9 September 2026.

   Three working prototypes of the Developments office hub, drawn over one
   invented data set. Palette and type are the app's own (globals.css); the only
   added token is --sunken, a recessed ground so a panel reads as raised without
   a shadow or radius. Nothing here is wired to the application. */
:root {
  color-scheme: light;
  --ground: #f1f1ee; --sunken: #e7e7e3; --panel: #ffffff; --panel-2: #ececea; --panel-3: #e0e0dc;
  --line: #dcdbd6; --line-2: #c6c5bf;
  --text: #1a1b19; --text-2: #55564f; --text-3: #6b6c65;
  --brass: #7d621b; --brass-2: #a8842f; --brass-ink: #ffffff; --brass-wash: rgba(125,98,27,.09);
  --alert: #a83c22; --alert-wash: rgba(168,60,34,.09);
  --caution: #7d5a12; --caution-wash: rgba(125,90,18,.11);
  --ok: #2b6b48; --ok-wash: rgba(43,107,72,.10);
  --rail: #3a3f31; --rail-2: #454b36; --rail-line: #555c45; --rail-text: #f3f2ec; --rail-dim: #b9bba9; --rail-brass: #d9ae4a;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r: 2px;
  --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0e1013; --sunken: #0a0c0e; --panel: #15181b; --panel-2: #1b1f23; --panel-3: #23282d;
    --line: #23282c; --line-2: #333a40;
    --text: #e9ebec; --text-2: #99a1a8; --text-3: #7a828a;
    --brass: #d9ae4a; --brass-2: #a8842f; --brass-ink: #14171a; --brass-wash: rgba(217,174,74,.09);
    --alert: #e2705a; --alert-wash: rgba(226,112,90,.11);
    --caution: #dda94f; --caution-wash: rgba(221,169,79,.11);
    --ok: #63b78d; --ok-wash: rgba(99,183,141,.11);
    --rail: #0a0c0e; --rail-2: #111417; --rail-line: #23282c; --rail-text: #e9ebec; --rail-dim: #8c949b; --rail-brass: #d9ae4a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0e1013; --sunken: #0a0c0e; --panel: #15181b; --panel-2: #1b1f23; --panel-3: #23282d;
  --line: #23282c; --line-2: #333a40;
  --text: #e9ebec; --text-2: #99a1a8; --text-3: #7a828a;
  --brass: #d9ae4a; --brass-2: #a8842f; --brass-ink: #14171a; --brass-wash: rgba(217,174,74,.09);
  --alert: #e2705a; --alert-wash: rgba(226,112,90,.11);
  --caution: #dda94f; --caution-wash: rgba(221,169,79,.11);
  --ok: #63b78d; --ok-wash: rgba(99,183,141,.11);
  --rail: #0a0c0e; --rail-2: #111417; --rail-line: #23282c; --rail-text: #e9ebec; --rail-dim: #8c949b; --rail-brass: #d9ae4a;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- Concept switcher (document chrome, not part of any concept) ---- */
#sw { height: 42px; display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s4); background: var(--text); color: var(--ground); font-family: var(--mono); font-size: 11px; letter-spacing: .08em; }
#sw .t { text-transform: uppercase; opacity: .7; }
#sw .seg { display: flex; border: 1px solid rgba(255,255,255,.25); border-radius: var(--r); overflow: hidden; }
#sw .seg button { background: none; border: 0; color: inherit; padding: 6px 14px; font: inherit; letter-spacing: .08em; opacity: .7; border-right: 1px solid rgba(255,255,255,.25); }
#sw .seg button:last-child { border-right: 0; }
#sw .seg button.on { background: var(--brass); color: var(--brass-ink); opacity: 1; }
#sw .seg button:hover { opacity: 1; }
#sw .sp { margin-left: auto; }
#sw .lk { background: none; border: 1px solid rgba(255,255,255,.25); color: inherit; padding: 5px 10px; font: inherit; letter-spacing: .08em; text-transform: uppercase; border-radius: var(--r); opacity: .85; }
#sw .lk:hover { opacity: 1; border-color: var(--brass); }
#stage { height: calc(100vh - 42px); min-width: 1180px; overflow: hidden; }
#stage > div { height: 100%; display: flex; flex-direction: column; }

/* ---- Brief drawer ---- */
#brief { position: fixed; top: 42px; right: 0; bottom: 0; width: 470px; background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: -12px 0 32px rgba(0,0,0,.14); z-index: 60; overflow: auto; padding: var(--s5); transform: translateX(100%); transition: transform .18s ease; }
#brief.open { transform: none; }
#brief h2 { font-size: 18px; font-weight: 500; margin: 0 0 var(--s2); letter-spacing: -.01em; }
#brief .kick { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin-bottom: var(--s2); }
#brief h4 { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin: var(--s5) 0 var(--s2); font-weight: 500; }
#brief p, #brief li { font-size: 13px; color: var(--text-2); margin: 0 0 var(--s2); }
#brief ul { padding-left: 18px; margin: 0; }
#brief li b { color: var(--text); font-weight: 500; }
#brief .x { position: absolute; top: var(--s3); right: var(--s3); background: none; border: 0; font-size: 18px; color: var(--text-3); }
#brief table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: var(--s2); }
#brief th { text-align: left; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line-2); }
#brief td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--text-2); }
#brief td:first-child { color: var(--text); font-weight: 500; white-space: nowrap; }
#brief .rec { margin-top: var(--s4); border: 1px solid var(--brass); border-left-width: 3px; background: var(--brass-wash); padding: var(--s3) var(--s4); }
#brief .rec p { margin: 0 0 var(--s2); }
#toasts { position: fixed; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 80; }
.toast { background: var(--text); color: var(--ground); font-size: 13px; padding: 10px 14px; border-left: 3px solid var(--brass); box-shadow: 0 8px 24px rgba(0,0,0,.2); max-width: 440px; }

/* ---- Shared register primitives (the system's own idiom) ---- */
.tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; border: 1px solid; border-radius: var(--r); padding: 2px var(--s2); }
.tag::before { content: "\25CF"; font-size: 8px; line-height: 1; }
.tag-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); }
.tag-alert { color: var(--alert); border-color: var(--alert); background: var(--alert-wash); }
.tag-alert::before { content: "\25B2"; }
.tag-caution { color: var(--caution); border-color: var(--caution); background: var(--caution-wash); }
.tag-caution::before { content: "\25C6"; }
.tag-quiet { color: var(--text-3); border-color: var(--line-2); background: transparent; }
.tag-quiet::before { content: "\25CB"; }
.tag-brass { color: var(--brass); border-color: var(--brass); background: var(--brass-wash); }
.tag-brass::before { content: "\25A0"; }
.ref { font-family: var(--mono); font-size: 12px; color: var(--brass); letter-spacing: .02em; font-weight: 500; white-space: nowrap; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.due { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.late { color: var(--alert); } .soon { color: var(--caution); } .fine { color: var(--text-3); } .okc { color: var(--ok); }
.btn { font-family: var(--mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; background: var(--brass); color: var(--brass-ink); border: 1px solid var(--brass); border-radius: var(--r); padding: var(--s2) var(--s4); white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn-q { background: transparent; color: var(--text-2); border-color: var(--line-2); }
.btn-q:hover { color: var(--brass); border-color: var(--brass); filter: none; }
.btn-sm { padding: 5px var(--s3); font-size: 10px; }
.actions { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
.panel-head h4 { margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .12em; color: var(--text-2); }
.panel-head .more { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--brass); letter-spacing: .06em; background: none; border: 0; padding: 0; }
.panel-head .more:hover { text-decoration: underline; }
.panel-foot { padding: var(--s3) var(--s4); border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); display: flex; gap: var(--s3); align-items: center; }
.panel-foot .more { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--brass); background: none; border: 0; padding: 0; }
table.reg { width: 100%; border-collapse: collapse; }
table.reg th { text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .11em; color: var(--text-3); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line-2); background: var(--panel-2); white-space: nowrap; }
table.reg td { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
table.reg tr:last-child td { border-bottom: 0; }
table.reg tbody tr.go { cursor: pointer; }
table.reg tbody tr.go:hover { background: var(--brass-wash); }
table.reg tr.sel { background: var(--brass-wash); box-shadow: inset 2px 0 0 var(--brass); }
table.reg td.r, table.reg th.r { text-align: right; }
table.reg .arrow { color: var(--text-3); font-family: var(--mono); }
.rowtitle { font-weight: 500; font-size: 13.5px; }
.rowsub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.rowsub .sep { color: var(--line-2); margin: 0 6px; }
.mini { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); align-items: flex-start; width: 100%; text-align: left; background: none; border-left: 2px solid transparent; border-right: 0; border-top: 0; }
.mini:last-child { border-bottom: 0; }
.mini:hover { background: var(--brass-wash); }
.mini.on { background: var(--brass-wash); border-left-color: var(--brass); }
.mini-b { flex: 1; min-width: 0; }
.mini-b p { margin: 0; font-size: 13px; }
.age { font-family: var(--mono); font-size: 11px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { padding: var(--s6) var(--s5); color: var(--text-3); font-size: 13px; text-align: center; }
.chip { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; border: 1px solid var(--line-2); border-radius: var(--r); padding: 3px var(--s3); color: var(--text-2); background: var(--panel); white-space: nowrap; cursor: pointer; }
.chip:hover { border-color: var(--brass); }
.chip.on { border-color: var(--brass); color: var(--brass); background: var(--brass-wash); }
.chip.warn { color: var(--alert); }
.chip.warn.on { border-color: var(--alert); background: var(--alert-wash); }
.chip i { font-style: normal; opacity: .75; margin-left: 4px; }
.filters { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; padding: var(--s3) var(--s4); background: var(--panel-2); border: 1px solid var(--line); }
.filters .spacer { margin-left: auto; }
.cbar { display: flex; height: 6px; width: 100%; background: var(--panel-3); border-radius: 1px; overflow: hidden; }
.cbar i { display: block; height: 100%; }
.cbar .late { background: var(--alert); } .cbar .verify { background: var(--brass-2); } .cbar .open { background: var(--line-2); }
.cbar-key { display: flex; gap: var(--s4); font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--text-3); text-transform: uppercase; flex-wrap: wrap; }
.cbar-key span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: -1px; }
.cbar-key .k-late::before { background: var(--alert); } .cbar-key .k-verify::before { background: var(--brass-2); } .cbar-key .k-open::before { background: var(--line-2); }
.figs { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); background: var(--panel); }
.figs button { text-align: left; padding: var(--s4); border: 0; border-right: 1px solid var(--line); background: none; display: block; }
.figs button:last-child { border-right: 0; }
.figs button:hover { background: var(--brass-wash); }
.figs button.hot { box-shadow: inset 0 3px 0 var(--alert); }
.figs button.hot dd { color: var(--alert); }
.figs dt { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .11em; color: var(--text-3); }
.figs dd { margin: var(--s2) 0 0; font-family: var(--mono); font-size: 26px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1.1; }
.figs dd small { font-size: 12px; color: var(--text-3); letter-spacing: 0; margin-left: 6px; font-family: var(--sans); }
.figs .go { display: block; margin-top: var(--s2); font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--brass); text-transform: uppercase; }
.sheet { background: var(--panel); border: 1px solid var(--line); padding: var(--s4) var(--s5) var(--s5); min-width: 0; }
.sheet-title { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s4); border-bottom: 1px solid var(--line-2); padding-bottom: var(--s3); }
.sheet-title h4 { margin: 6px 0 var(--s1); font-size: 18px; font-weight: 500; letter-spacing: -.015em; }
.sheet-title .rowsub { margin-top: 0; }
.crumbs { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .03em; }
.crumbs button, .crumbs a { font-weight: 500; color: var(--brass); background: none; border: 0; padding: 0; font: inherit; }
.crumbs button:hover { text-decoration: underline; }
.crumbs span { margin: 0 6px; color: var(--line-2); }
.tb { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); margin-top: var(--s3); }
.tb div { padding: var(--s3) var(--s4); border-right: 1px solid var(--line); min-width: 0; }
.tb div:last-child { border-right: 0; }
.tb dt { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
.tb dd { margin: var(--s1) 0 0; font-size: 13px; overflow-wrap: anywhere; }
.tb.three { grid-template-columns: repeat(3, 1fr); }
.sec-h { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); margin: var(--s5) 0 var(--s2); display: flex; align-items: center; gap: var(--s3); }
.sec-h .more { margin-left: auto; color: var(--brass); background: none; border: 0; font: inherit; letter-spacing: .06em; }
.obs { padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
.obs:last-child { border-bottom: 0; }
.obs .k { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); }
.obs .k.defect { color: var(--alert); } .obs .k.variation { color: var(--caution); } .obs .k.access { color: var(--text-3); }
.obs h5 { margin: 2px 0 4px; font-size: 14px; font-weight: 500; }
.obs p { margin: 0 0 4px; font-size: 13px; color: var(--text-2); }
.obs p b { color: var(--text); font-weight: 500; }
.photos { display: flex; gap: var(--s2); margin-top: var(--s2); flex-wrap: wrap; }
.ph { width: 96px; height: 72px; background: linear-gradient(135deg, var(--panel-3), var(--panel-2)); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: .06em; }
.hist { display: flex; gap: var(--s4); padding: var(--s3) 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.hist:last-child { border-bottom: 0; }
.hist .d { font-family: var(--mono); font-size: 12px; color: var(--text-2); width: 96px; flex: none; font-variant-numeric: tabular-nums; }
.hist .b { flex: 1; min-width: 0; }
.hist .b p { margin: 0; font-size: 13px; }
.hist .b p b { font-weight: 500; }
.note { margin-top: var(--s3); padding: 10px 12px; border: 1px solid var(--line-2); border-left-width: 3px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: var(--s3); background: var(--panel-2); }
.note.warn { border-color: var(--caution); background: var(--caution-wash); }
.note.bad { border-color: var(--alert); background: var(--alert-wash); }
.note.good { border-color: var(--ok); background: var(--ok-wash); }
.note.brass { border-color: var(--brass); background: var(--brass-wash); }
.note b { font-weight: 500; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); align-items: start; }
.two-wide { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: var(--s5); align-items: start; }
.two-read { display: grid; grid-template-columns: minmax(360px, .85fr) minmax(0, 1.15fr); gap: var(--s5); align-items: start; }
.stack { display: flex; flex-direction: column; gap: var(--s5); min-width: 0; }
.search { position: relative; }
.search input { width: 100%; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s2) var(--s3); color: var(--text); font: inherit; font-size: 13px; }
.search input::placeholder { color: var(--text-3); }
.search kbd { position: absolute; right: 10px; top: 8px; font-family: var(--mono); font-size: 10px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 2px; padding: 1px 5px; pointer-events: none; }
.whoami { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--text-2); white-space: nowrap; }
.whoami em { font-style: normal; color: var(--brass); }
.tbtn { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); background: none; border: 0; padding: 4px 6px; white-space: nowrap; }
.tbtn:hover { color: var(--text); }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); }
.help-grid p { font-size: 13px; color: var(--text-2); margin: 0 0 var(--s3); }
.help-grid ol { padding-left: 20px; margin: 0; font-size: 13px; color: var(--text-2); }
.help-grid li { margin-bottom: var(--s2); }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s4); }
.pagehead h3 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.pagehead p { margin: var(--s1) 0 0; font-size: 13px; color: var(--text-2); }
.pagehead .kick { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); margin-bottom: 4px; }
.proto { position: fixed; left: 16px; bottom: 16px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); background: var(--panel); border: 1px solid var(--line-2); padding: 4px 8px; z-index: 30; }

/* =====================================================================
   Concept 1 · Desk. Horizontal tab bar with live counts, a scope strip
   that follows you from tab to tab, and a register-first home.
   ===================================================================== */
.c1 .topbar { flex: none; display: flex; align-items: center; gap: var(--s5); background: var(--panel); border-bottom: 1px solid var(--line-2); padding: 0 var(--s5); height: 56px; }
.c1 .logo { display: flex; align-items: baseline; gap: var(--s3); }
.c1 .logo b { font-size: 17px; font-weight: 500; letter-spacing: .12em; }
.c1 .logo span { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--brass); border-left: 1px solid var(--line-2); padding-left: var(--s3); }
.c1 .search { flex: 1; max-width: 440px; }
.c1 .topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--s4); }
.c1 .bell { font-family: var(--mono); font-size: 11px; color: var(--text-2); letter-spacing: .08em; background: none; border: 1px solid transparent; padding: 4px 8px; border-radius: var(--r); }

<script>
(function () {
'use strict';
/* ------------------------------------------------------------------ utils */
const pad = n => String(n).padStart(2, '0');
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TODAY = '2026-09-09';
const MS = 864e5;
const iso = s => new Date(s.slice(0, 10) + 'T12:00:00');
const dayDiff = (a, b) => Math.round((iso(a) - iso(b)) / MS);
const fmt = s => { if (!s) return '—'; const d = iso(s); return `${pad(d.getDate())} ${MON[d.getMonth()]}`; };
const fmtL = s => { const d = iso(s); return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDT = s => s && s.length > 10 ? `${fmt(s)} ${s.slice(11, 16)}` : fmt(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const ago = s => { const d = dayDiff(TODAY, s); return d === 0 ? 'today' : d === 1 ? 'yesterday' : `${d}d ago`; };
const dueWord = t => { const d = dayDiff(t, TODAY); return d < 0 ? `${-d}d overdue` : d === 0 ? 'due today' : d === 1 ? 'due tomorrow' : `due in ${d}d`; };
const dueCls = t => { const d = dayDiff(t, TODAY); return d < 0 ? 'late' : d <= 3 ? 'soon' : 'fine'; };
// Issue-aware wording: work put forward as complete is not "overdue".
const whenWord = i => !active(i) ? 'closed' : verify(i) ? 'put forward as complete' : dueWord(i.target);
const dueClsI = i => !active(i) ? 'fine' : verify(i) ? 'okc' : dueCls(i.target);

/* --------------------------------------------------------------- the data
   Invented, in the Leodis format. Three projects are the app's own fixtures;
   two more are added so the desk has enough on it to be worth looking at. */
const PROJECTS = [
  { id: 'p011', num: '011LME', name: 'Tetley Hall - Block E', client: 'C&AJ Marshall Builders Ltd', pm: 'A. Whitfield', status: '4. Active', div: 'Leodis M&E', review: false, stage: 'First fix complete; second fix on levels 1–3', next: 'Client walk-round Fri 11 Sep' },

function queueItems() {
  const is = scopedIssues(), rs = scopedReports();

  else if (f === 'overdue') is.filter(overdue).forEach(i => push('issue', i, 0));
  else if (f === 'verify') is.filter(verify).forEach(i => push('issue', i, 2));
  else if (f === 'unassigned') is.filter(unassigned).forEach(i => push('issue', i, 1));
  else if (f === 'provisional') is.filter(provisional).forEach(i => push('issue', i, 3));
  else if (f === 'review') rs.filter(toReview).forEach(r => push('report', r, 1.5));
  else if (f === 'returned') rs.filter(r => r.review === 'returned').forEach(r => push('report', r, 3.5));
  else if (f === 'today') rs.filter(todayR).forEach(r => push('report', r, 0));
  else if (f === 'week') rs.filter(week).forEach(r => push('report', r, 0));
  return items.sort((a, b) => a.pri - b.pri || (a.kind === 'issue' ? a.x.target : a.x.received).localeCompare(b.kind === 'issue' ? b.x.target : b.x.received));

    ${late.length ? `<div class="sec-h">Start here</div>${late.slice(0, 3).map(i => `<button class="mini" type="button" ${G(undefined, undefined, 'overdue', i.id)}><span class="ref">${i.ref}</span><div class="mini-b"><p>${esc(i.desc)}</p><div class="rowsub">${esc(P[i.pj].name)}<span class="sep">|</span>${esc(i.owner || 'Unassigned')}<span class="sep">|</span><span class="late">${whenWord(i)}</span></div></div>${issueTag(i)}</button>`).join('')}` : ''}

    <table class="reg"><thead><tr><th>Project</th><th class="r">Open</th><th class="r">Overdue</th><th class="r">To verify</th><th class="r">To review</th><th>Last from site</th></tr></thead><tbody>${scopedProjects().map(p => { const r = projectRoll(p.id); return `<tr class="go" ${G('projects', undefined, '', p.id)}><td><div class="rowtitle">${esc(p.name)}</div><div class="rowsub">${p.num}</div></td><td class="r num">${r.open}</td><td class="r num ${r.late ? 'late' : ''}">${r.late}</td><td class="r num">${r.ver}</td><td class="r num ${r.review ? 'soon' : ''}">${r.review}</td><td><span class="due">${fmt(r.last.received)}</span> <span class="rowsub" style="display:inline">${esc(r.last.author)}</span></td></tr>`; }).join('')}</tbody></table>
    ${c.drafts ? `<div class="note" style="margin-top:16px"><span>${plural(c.drafts, 'draft')} being written on site now. Contents stay private until submitted.</span><button class="btn btn-q btn-sm" type="button" ${G('reports', undefined, 'drafts', '')}>See who</button></div>` : ''}
  </div>`;
}

/* ------------------------------------------------------------- briefs */
const BRIEFS = {
  1: `<div class="kick">Concept 1</div><h2>Desk</h2><p>The shell you liked in the Compliance prototype, applied to Developments: a fixed-height app with a horizontal tab bar, a register-first home and a reader beside every list.</p>

  2: `<div class="kick">Concept 2</div><h2>Rail</h2><p>A dark rail on the left that never moves. It holds navigation, live counts and, crucially, the project scope, so the answer to "where am I and what am I looking at" is always in the same place.</p>

    <h4>What changes from today</h4><ul><li>The dark band that is currently only a header becomes the rail; the olive charcoal is kept and refined.</li><li>The four launch tiles disappear; the matrix does their job with real numbers.</li><li>Projects become one-page sheets with the same four figures as the matrix row.</li></ul>
    <h4>Build cost</h4><p>Medium. The rail is a layout change; the matrix needs per-project counts, which the office page already computes for its project watch panel.</p>`,
  3: `<div class="kick">Concept 3</div><h2>Triage</h2><p>One queue, one reader. The home is not a summary of work, it is the work: everything that needs a decision, in priority order, with the thing you are deciding about open beside it. The other tabs are lenses on the same three panes.</p>

    <h4>What changes from today</h4><ul><li>Reports and issues share one list for the first time, ranked by what needs doing rather than by type.</li><li>Project tiles and launchers go; projects are a lens and a sheet.</li><li>The reader takes the whole right side of the screen.</li></ul>
    <h4>Build cost</h4><p>Medium to high. The unified queue needs a shared ranking across issues and reports, and the reader already exists as the preview page. Best on a wide monitor; it does not fold down to a phone well.</p>`,
};
const COMPARE = `<div class="kick">Choosing between them</div><h2>Compare and recommendation</h2>
  <table><thead><tr><th>Concept</th><th>Answers first</th><th>Best when</th><th>Cost</th></tr></thead><tbody>

/* ------------------------------------------------------------- runtime */
const stage = document.getElementById('stage'), brief = document.getElementById('brief');
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 4000); }
const ACTS = { verify: 'Prototype: this would record an independent verification and close the issue.', reopen: 'Prototype: this would reopen the issue and notify the owner.', assign: 'Prototype: this would open the people roster to name an owner.', confirm: 'Prototype: this would confirm the defect and start its target clock.', dispute: 'Prototype: this would mark the item disputed and ask the engineer for more.', retarget: 'Prototype: this would agree a new target date with the client on record.', open: 'Prototype: this would open the full report preview.', pdf: 'Prototype: this would open the issued PDF.', approve: 'Prototype: this would approve the report and queue the PDF for issue.', 'return': 'Prototype: this would return the report to the engineer with a note.', resend: 'Prototype: this would re-send the issued PDF to the distribution list.', engineer: 'Prototype: this would switch to the Engineer view.', companies: 'Prototype: this would return to company selection.', signout: 'Prototype: this would sign you out.', 'pdf-install': 'Prototype: this would open the installation guide PDF.', 'pdf-engineer': 'Prototype: this would open the engineer companion PDF.' };
function render() {
  const view = stage.querySelector('.view, .reader, .list'); const scrolls = {}; stage.querySelectorAll('.view,.reader,.list,.lenses,.rail').forEach((el, k) => { scrolls[el.className + k] = el.scrollTop; });
  const q = document.getElementById('q'); const focus = q && document.activeElement === q; const pos = q ? q.selectionStart : 0;
  stage.innerHTML = (S.c === 2 ? c2 : S.c === 3 ? c3 : c1)();
  stage.querySelectorAll('.view,.reader,.list,.lenses,.rail').forEach((el, k) => { const v = scrolls[el.className + k]; if (v) el.scrollTop = v; });
  const q2 = document.getElementById('q'); if (q2 && focus) { q2.focus(); q2.setSelectionRange(pos, pos); }
  document.querySelectorAll('#swseg button').forEach(b => b.classList.toggle('on', Number(b.dataset.c) === S.c));
  if (brief.classList.contains('open') && brief.dataset.mode !== 'compare') brief.innerHTML = `<button class="x" type="button" data-act="close-brief">×</button>` + BRIEFS[S.c];
}
stage.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && stage.contains(a)) { e.preventDefault(); if (a.dataset.act === 'theme') { document.getElementById('themer').click(); return; } toast(ACTS[a.dataset.act] || 'Prototype.'); return; }
  const g = e.target.closest('[data-go]');
  if (!g) return;
  e.preventDefault();
  const v = g.dataset.go.split('|').map(x => x === '*' ? undefined : x);
  go(v[0], v[1], v[2], v[3], g.dataset.from || (S.tab === 'home' && v[0] && v[0] !== 'home' ? (v[2] || v[0]) : undefined));
});
stage.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { const q = document.getElementById('q'); if (q) { e.preventDefault(); q.focus(); } } if (e.key === 'Escape' && brief.classList.contains('open')) closeBrief(); });
document.getElementById('swseg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { S.c = Number(b.dataset.c); S.tab = 'home'; S.pj = ''; S.f = ''; S.sel = ''; S.q = ''; S.from = null; commit(); } });
function closeBrief() { brief.classList.remove('open'); brief.setAttribute('aria-hidden', 'true'); }
document.getElementById('sw').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'brief') { brief.dataset.mode = 'brief'; brief.innerHTML = `<button class="x" type="button" data-act="close-brief">×</button>` + BRIEFS[S.c]; brief.classList.add('open'); brief.setAttribute('aria-hidden', 'false'); }
  if (b.dataset.act === 'compare') { brief.dataset.mode = 'compare'; brief.innerHTML = `<button class="x" type="button" data-act="close-brief">×</button>` + COMPARE; brief.classList.add('open'); brief.setAttribute('aria-hidden', 'false'); }
});
brief.addEventListener('click', e => { if (e.target.closest('[data-act="close-brief"]')) closeBrief(); });
window.addEventListener('hashchange', () => { if (location.hash !== hashOf()) { parse(location.hash); render(); } });
(function () {
  const btn = document.getElementById('themer'), root = document.documentElement;
  const current = () => root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const label = () => { btn.textContent = current() === 'dark' ? 'Light' : 'Dark'; };
  label();
  btn.addEventListener('click', () => { root.setAttribute('data-theme', current() === 'dark' ? 'light' : 'dark'); label(); });
})();
parse(location.hash);
commit();
})();
</script>
