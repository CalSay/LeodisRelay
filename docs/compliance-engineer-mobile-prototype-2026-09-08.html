<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance Engineer Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Relay · Leodis Compliance Management · engineer mobile prototype.
   Same data model and tokens as the portfolio browser. Field rules from the
   app apply: status never depends on colour alone, and anything an engineer
   taps is at least 48px. */
:root {
  color-scheme: light;
  --ground: #eeede9; --sunken: #e4e3de; --panel: #f8f7f3; --panel-2: #efeeea; --panel-3: #e3e2dd;
  --line: #d6d7d3; --line-2: #c3c6c4;
  --text: #25282a; --text-2: #5b5f60; --text-3: #767a7b;
  --aqua: #267c76; --aqua-ink: #ffffff; --aqua-wash: rgba(38,124,118,.09);
  --gold: #816321; --gold-ink: #ffffff; --gold-wash: rgba(129,99,33,.09);
  --alert: #a83c22; --alert-wash: rgba(168,60,34,.09);
  --caution: #7d5a12; --caution-wash: rgba(125,90,18,.11);
  --ok: #2b6b48; --ok-wash: rgba(43,107,72,.10);
  --r: 2px; --touch: 48px;
  --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #202224; --sunken: #1a1c1e; --panel: #282b2d; --panel-2: #2e3134; --panel-3: #363a3d;
    --line: #3a3e41; --line-2: #484c4e;
    --text: #f0efeb; --text-2: #b5b7b6; --text-3: #868a8b;
    --aqua: #77c7bf; --aqua-ink: #16201f; --aqua-wash: rgba(119,199,191,.10);
    --gold: #ccb071; --gold-ink: #202224; --gold-wash: rgba(204,176,113,.10);
    --alert: #e2705a; --alert-wash: rgba(226,112,90,.11);
    --caution: #dda94f; --caution-wash: rgba(221,169,79,.11);
    --ok: #63b78d; --ok-wash: rgba(99,183,141,.11);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #202224; --sunken: #1a1c1e; --panel: #282b2d; --panel-2: #2e3134; --panel-3: #363a3d;
  --line: #3a3e41; --line-2: #484c4e;
  --text: #f0efeb; --text-2: #b5b7b6; --text-3: #868a8b;
  --aqua: #77c7bf; --aqua-ink: #16201f; --aqua-wash: rgba(119,199,191,.10);
  --gold: #ccb071; --gold-ink: #202224; --gold-wash: rgba(204,176,113,.10);
  --alert: #e2705a; --alert-wash: rgba(226,112,90,.11);
  --caution: #dda94f; --caution-wash: rgba(221,169,79,.11);
  --ok: #63b78d; --ok-wash: rgba(99,183,141,.11);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sunken); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Stage: a phone on a desk. On an actual phone the frame is the viewport. */
.stage { min-height: 100vh; display: grid; place-items: center; padding: 24px; gap: 16px; grid-template-rows: 1fr auto; }
.phone { width: 390px; height: 844px; max-height: calc(100vh - 80px); background: var(--ground); border: 1px solid var(--line-2); border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 30px 60px rgba(0,0,0,.18), inset 0 0 0 6px var(--panel-3); position: relative; }
.caption { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); text-align: center; }
@media (max-width: 480px) { .stage { padding: 0; min-height: 100dvh; grid-template-rows: 1fr; } .phone { width: 100%; height: 100dvh; max-height: none; border: 0; border-radius: 0; box-shadow: none; } .caption { display: none; } }

/* Chrome */
.appbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 12px 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line-2); min-height: 64px; }
.brandm { display: flex; align-items: baseline; gap: 8px; padding-right: 8px; border-right: 1px solid var(--line-2); }
.brandm b { font-size: 13px; font-weight: 500; letter-spacing: .12em; }
.brandm span { font-family: var(--mono); font-size: 9px; letter-spacing: .16em; color: var(--aqua); }
.abt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.abt b { font-size: 16px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.abt span { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: var(--touch); height: var(--touch); flex: none; display: grid; place-items: center; background: none; border: 0; border-radius: var(--r); font-size: 22px; color: var(--text-2); }
.iconbtn:hover { background: var(--sunken); }
.wknav { display: flex; }
.screen { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; display: flex; flex-direction: column; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); border-top: 1px solid var(--line-2); height: 64px; }
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); border-top: 2px solid transparent; position: relative; }
.tabbar a i { font-style: normal; font-size: 18px; line-height: 1; }
.tabbar a.on { color: var(--text); border-top-color: var(--aqua); }
.tabbar a.on i { color: var(--aqua); }
.tabbar a b { position: absolute; top: 8px; right: 22%; font-size: 10px; min-width: 18px; height: 18px; display: grid; place-items: center; border-radius: 9px; background: var(--gold); color: var(--gold-ink); font-weight: 500; }

/* Type helpers */
.sec-h { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); margin: 20px 16px 8px; display: flex; align-items: center; gap: 8px; }
.sec-h .cnt { margin-left: auto; color: var(--aqua); letter-spacing: .06em; }
.ref { font-family: var(--mono); font-size: 12px; color: var(--aqua); letter-spacing: .02em; font-weight: 500; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.late { color: var(--alert); } .soon { color: var(--caution); } .fine { color: var(--text-3); } .okc, .ok { color: var(--ok); }
.tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; border: 1px solid; border-radius: var(--r); padding: 2px 8px; }
.tag::before { content: "●"; font-size: 8px; line-height: 1; }
.tag-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); }
.tag-alert { color: var(--alert); border-color: var(--alert); background: var(--alert-wash); } .tag-alert::before { content: "▲"; }
.tag-caution { color: var(--caution); border-color: var(--caution); background: var(--caution-wash); } .tag-caution::before { content: "◆"; }
.tag-quiet { color: var(--text-3); border-color: var(--line-2); background: transparent; } .tag-quiet::before { content: "○"; }
.tag-aqua { color: var(--aqua); border-color: var(--aqua); background: var(--aqua-wash); } .tag-aqua::before { content: "■"; }
.tag-gold { color: var(--gold); border-color: var(--gold); background: var(--gold-wash); } .tag-gold::before { content: "◪"; }
.empty { padding: 20px 16px; color: var(--text-3); font-size: 14px; text-align: center; }
.fine-print { margin: 20px 16px 0; font-size: 12px; color: var(--text-3); line-height: 1.5; }
.note { margin: 12px 16px 0; padding: 12px 14px; border: 1px solid var(--line-2); border-left-width: 3px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel-2); }
.note.warn { border-color: var(--caution); background: var(--caution-wash); }
.note.info { border-color: var(--aqua); background: var(--aqua-wash); }
.note b { font-weight: 500; }
.btn { font-family: var(--mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; background: var(--gold); color: var(--gold-ink); border: 1px solid var(--gold); border-radius: var(--r); padding: 0 16px; min-height: var(--touch); white-space: nowrap; }
.btn-q { background: transparent; color: var(--text-2); border-color: var(--line-2); }
.btn.wide { width: 100%; }

/* Today summary */
.sum { display: grid; grid-template-columns: repeat(4, 1fr); margin: 16px 16px 0; border: 1px solid var(--line); background: var(--panel); }
.sum div { padding: 10px 12px; border-right: 1px solid var(--line); }
.sum div:last-child { border-right: 0; }
.sum dt { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
.sum dd { margin: 2px 0 0; font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.sum dd small { font-size: 11px; color: var(--text-3); margin-left: 3px; font-family: var(--sans); }

/* Visit cards */
.vlist { display: flex; flex-direction: column; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); }
.vcard { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent; min-height: var(--touch); }
.vcard:last-child { border-bottom: 0; }
.vcard:active, .vcard:hover { background: var(--sunken); }
.vcard.onsite { border-left-color: var(--aqua); background: var(--aqua-wash); }
.vcard.next { border-left-color: var(--gold); }
.vcard.done { opacity: .72; }
.vtime { width: 56px; flex: none; display: flex; flex-direction: column; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.vtime b { font-size: 15px; font-weight: 500; }
.vtime span { font-size: 10px; color: var(--text-3); }
.vbody { flex: 1; min-width: 0; }
.vhead { display: flex; align-items: baseline; gap: 8px; }
.vhead b { font-size: 15px; font-weight: 500; flex: 1; min-width: 0; }
.vsub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.vitems { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.vi { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line-2); border-radius: var(--r); color: var(--text-2); }
.vi.late { border-color: var(--alert); color: var(--alert); }
.vi.soon { border-color: var(--caution); color: var(--caution); }
.vi.none { border-style: dashed; }
.vi.did { border-color: var(--ok); color: var(--ok); text-decoration: line-through; }
.vfoot { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.travel { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .02em; }

/* Week */
.days { display: grid; grid-template-columns: repeat(7, 1fr); margin: 12px 16px 0; border: 1px solid var(--line); background: var(--panel); }
.day { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 60px; background: none; border: 0; border-right: 1px solid var(--line); border-top: 2px solid transparent; }
.day:last-child { border-right: 0; }
.day span { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.day b { font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
.day i { font-style: normal; font-size: 7px; letter-spacing: 2px; color: var(--aqua); height: 10px; }
.day.on { border-top-color: var(--aqua); background: var(--aqua-wash); }
.day.today b { color: var(--gold); }
.route { margin: 0 16px; border: 1px solid var(--line); background: var(--panel); padding: 8px 16px; }
.rstop { display: flex; align-items: center; gap: 12px; min-height: 40px; position: relative; }
.rstop i { width: 8px; height: 8px; border-radius: 50%; background: var(--aqua); flex: none; }
.rstop:not(:last-child)::before { content: ""; position: absolute; left: 3.5px; top: 24px; bottom: -16px; border-left: 1px dashed var(--line-2); }
.rstop b { font-weight: 500; font-size: 14px; flex: 1; }
.rstop span { font-family: var(--mono); font-size: 11px; color: var(--text-3); }

/* Visit screen */
.btnrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 16px 0; }
.bigbtn { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; min-height: 60px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); text-align: left; }
.bigbtn:first-child { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.bigbtn b { font-size: 14px; font-weight: 500; }
.bigbtn span { font-size: 11px; opacity: .8; font-family: var(--mono); letter-spacing: .02em; }
.addr { margin: 10px 16px 0; font-size: 13px; color: var(--text-2); }
.access { margin: 12px 16px 0; border: 1px solid var(--line); background: var(--panel); }
.access div { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.access div:last-child { border-bottom: 0; }
.access dt { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--aqua); }
.access dd { margin: 2px 0 0; font-size: 14px; }
.ilist { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); }
.irow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: var(--touch); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.irow:last-child { border-bottom: 0; }
.irow.did { opacity: .65; }
.irow:hover { background: var(--sunken); }
.imain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.imain b { font-size: 14px; font-weight: 500; }
.imain > span { font-size: 12px; color: var(--text-3); }
.istat { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chev { font-family: var(--mono); color: var(--text-3); font-size: 16px; }
.stick { position: sticky; bottom: 0; margin-top: auto; padding: 12px 16px 12px; background: linear-gradient(to bottom, transparent, var(--ground) 30%); display: flex; flex-direction: column; gap: 8px; }
.donebar { font-size: 13px; color: var(--text-2); text-align: center; padding: 12px; border: 1px solid var(--ok); background: var(--ok-wash); }
.kv { margin: 12px 16px 0; border: 1px solid var(--line); background: var(--panel); }
.kv div { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.kv div:last-child { border-bottom: 0; }
.kv dt { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
.kv dd { margin: 2px 0 0; font-size: 14px; }
.duem { display: grid; grid-template-columns: 1.4fr 1fr 1fr; margin: 12px 16px 0; border: 1px solid var(--line); background: var(--panel); }
.duem div { padding: 10px 12px; border-right: 1px solid var(--line); min-width: 0; }
.duem div:last-child { border-right: 0; }
.duem dt { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duem dd { margin: 2px 0 0; font-family: var(--mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.duem dd.txt { font-family: var(--sans); font-size: 12px; color: var(--text-2); }
.duem dd small { display: block; font-family: var(--sans); font-size: 11px; color: var(--text-3); }
.duem dd.late { color: var(--alert); } .duem dd.soon { color: var(--caution); } .duem dd.none { color: var(--text-3); }
.searchm { padding: 12px 16px 8px; }
.searchm input { width: 100%; min-height: var(--touch); background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); padding: 0 14px; font: inherit; font-size: 15px; color: var(--text); }
.cbar { display: flex; height: 6px; width: 100%; background: var(--panel-3); overflow: hidden; }
.cbar i { display: block; height: 100%; }
.cbar .ok { background: var(--ok); } .cbar .soon { background: var(--caution); } .cbar .late { background: var(--alert); } .cbar .none { background: var(--line-2); }
.meta { display: flex; gap: 12px; font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--text-3); flex-wrap: wrap; }
.f { display: flex; flex-direction: column; gap: 6px; }
.f label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
.f input, .f select, .f textarea { font: inherit; font-size: 15px; background: var(--sunken); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; min-height: var(--touch); }
.f textarea { min-height: 96px; resize: vertical; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line-2); border-radius: var(--r); overflow: hidden; }
.seg label { position: relative; min-height: var(--touch); display: grid; place-items: center; font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--text-2); background: var(--panel); }
.seg label + label { border-left: 1px solid var(--line-2); }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.seg input:checked + span { color: var(--aqua); font-weight: 500; }
.seg label:has(input:checked) { background: var(--aqua-wash); }
.photos { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ph { width: 64px; height: 64px; display: grid; place-items: center; border: 1px dashed var(--line-2); background: var(--panel); font-size: 20px; line-height: 1; color: var(--text-2); }
.ph span { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; }
.ph.thumb { border-style: solid; background: var(--panel-3); font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: var(--text-3); }
.phn { font-size: 12px; color: var(--text-3); }
.sig-line { font-family: var(--mono); font-size: 12px; color: var(--text-2); padding: 12px 14px; border: 1px solid var(--line); background: var(--panel); }

/* Service forms */
.vi.draft { border-color: var(--gold); color: var(--gold); }
.fsec { margin: 0 16px; border: 1px solid var(--line); background: var(--panel); }
.ff { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.ff:last-child { border-bottom: 0; }
.ff label { font-size: 14px; color: var(--text); font-family: var(--sans); text-transform: none; letter-spacing: 0; }
.ff label em { font-style: normal; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-left: 6px; }
.ff .seg label { font-size: 14px; }
.seg.s3 { grid-template-columns: repeat(3, 1fr); }
.seg.s2 { grid-template-columns: repeat(2, 1fr); }
.ff input, .ff select, .ff textarea { font: inherit; font-size: 15px; background: var(--sunken); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--r); padding: 12px 14px; min-height: var(--touch); width: 100%; }
.ff textarea { min-height: 72px; resize: vertical; }
.numf { display: flex; align-items: center; gap: 10px; }
.numf input { flex: 1; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.numf span { font-family: var(--mono); font-size: 12px; color: var(--text-3); min-width: 32px; }
.fstick { background: var(--panel); border-top: 1px solid var(--line-2); padding: 10px 16px 14px; gap: 10px; }
.prog { display: flex; flex-direction: column; gap: 6px; }
.progbar { height: 4px; background: var(--panel-3); overflow: hidden; }
.progbar i { display: block; height: 100%; background: var(--aqua); transition: width .2s; }
.prog span { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.btnpair { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.btn[disabled] { opacity: .45; cursor: default; }
.sig-line.signed { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); }

/* Bottom sheet */
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 16px 16px 0 0; padding: 0; width: 390px; max-width: 100vw; max-height: 86vh; overflow: auto; margin: auto auto 0; }
dialog::backdrop { background: rgba(20,22,24,.5); }
.sh-head { display: grid; grid-template-columns: 1fr auto; padding: 14px 8px 12px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.sh-head b { font-size: 17px; font-weight: 500; letter-spacing: -.01em; }
.sh-head span { grid-column: 1; font-size: 12px; color: var(--text-3); }
.sh-head .iconbtn { grid-row: 1 / span 2; grid-column: 2; }
.sh-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.sh-foot { padding: 12px 20px 20px; border-top: 1px solid var(--line); }
#toasts { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 50; width: min(360px, 92vw); }
.toast { background: var(--text); color: var(--ground); font-size: 13px; padding: 10px 14px; border-left: 3px solid var(--aqua); box-shadow: 0 8px 24px rgba(0,0,0,.25); }

let openAccess = false, bSearch = '';
const dlg = document.getElementById('dlg');
function openDlg(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); }
function closeDlg() { if (dlg.open) dlg.close(); dlg.innerHTML = ''; }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 4000); }
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

const longDate = d => `${DAYL[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
const vstatus = v => v.status === 'done' ? '<span class="tag tag-ok">Done</span>' : v.status === 'onsite' ? '<span class="tag tag-aqua">On site</span>' : dayDiff(v.date, TODAY) === 0 ? '<span class="tag tag-gold">Today</span>' : '<span class="tag tag-quiet">Planned</span>';
const itemWord = v => `${plural(v.items.length, 'item')} · ${v.items.reduce((n, gid) => n + GR[gid].assetIds.length, 0)} assets`;

/* ------------------------------------------------------------- screens */
function appbar(title, sub, back, right) {
  return `<header class="appbar">${back ? `<button class="iconbtn" data-act="back" type="button" aria-label="Back">‹</button>` : `<div class="brandm"><b>RELAY</b><span>COMPLIANCE</span></div>`}<div class="abt"><b>${esc(title)}</b>${sub ? `<span>${sub}</span>` : ''}</div>${right || ''}</header>`;
}
function travelLine(prev, code) {
  const from = prev ? BL[prev].name.split(' —')[0] : 'the depot'; const min = prev ? driveMin(prev, code) : 9 + (codeSum(code) % 22);
  return `<span class="travel">🚐 ${min} min · ${miles(min)} mi from ${esc(from)}</span>`;
}
function visitCard(v, prev, compact) {
  const b = BL[v.building]; const s = SITE[v.building]; const next = !compact && v.status === 'planned' && visitsOn(me, v.date).filter(x => x.status !== 'done').indexOf(v) === 0 && dayDiff(v.date, TODAY) === 0;
  const items = v.items.map(gid => GR[gid]);
  return `<a class="vcard ${v.status} ${next ? 'next' : ''}" href="#/visit/${v.id}">
    <div class="vtime"><b>${v.time}</b>${v.status === 'done' ? `<span>–${v.finished}</span>` : v.status === 'onsite' ? `<span>since ${v.started}</span>` : ''}</div>
    <div class="vbody">
      <div class="vhead"><b>${esc(b.name)}</b>${vstatus(v)}</div>
      <div class="vsub">${esc(CL[b.client].name)} · ${esc(s.addr.split(',').slice(-2).join(',').trim())}</div>
      <div class="vitems">${items.slice(0, 3).map(g => `<span class="vi ${isDoneItem(v, g.id) ? 'did' : isDraft(g) ? 'draft' : status(g).key}">${esc(g.label)}</span>`).join('')}${items.length > 3 ? `<span class="vi">+${items.length - 3}</span>` : ''}</div>
      ${compact ? '' : `<div class="vfoot">${travelLine(prev, v.building)}${v.status === 'done' ? `<span class="travel">${plural(v.filed.length, 'report')} filed</span>` : ''}</div>`}
    </div></a>`;
}
function screenToday() {
  const list = visitsOn(me, TODAY); const todo = list.filter(v => v.status !== 'done'); const items = list.reduce((n, v) => n + v.items.length, 0);
  let prev = null;
  const cards = list.map(v => { const h = visitCard(v, prev); prev = v.building; return h; }).join('');
  const onsite = list.find(v => v.status === 'onsite');
  return appbar('Today', `${longDate(TODAY)} · ${ENG[me].name}`, false, `<button class="iconbtn" data-act="theme" type="button" aria-label="Appearance">◐</button>`) + `<main class="screen">
    <div class="sum"><div><dt>Visits</dt><dd>${list.length}</dd></div><div><dt>To go</dt><dd>${todo.length}</dd></div><div><dt>Items</dt><dd>${items}</dd></div><div><dt>Drive</dt><dd>${list.reduce((n, v, i) => n + (i ? driveMin(list[i - 1].building, v.building) : 12), 0)}<small>min</small></dd></div></div>
    ${onsite ? `<div class="note info"><span><b>You are on site at ${esc(BL[onsite.building].name.split(' —')[0])}</b> since ${onsite.started}. ${onsite.items.filter(g => !isDoneItem(onsite, g)).length} of ${onsite.items.length} items still to file${onsite.items.filter(g => !isDoneItem(onsite, g) && isDraft(GR[g])).length ? ` (${onsite.items.filter(g => !isDoneItem(onsite, g) && isDraft(GR[g])).length} in draft)` : ''}.</span></div>` : ''}
    <div class="sec-h">Your day</div>
    <div class="vlist">${cards || '<div class="empty">Nothing booked today.</div>'}</div>
    <div class="sec-h">Tomorrow</div>
    <div class="vlist">${visitsOn(me, addDays(TODAY, 1)).map(v => visitCard(v, null, true)).join('') || '<div class="empty">Nothing booked.</div>'}</div>
    <p class="fine-print">Drafts and photos stay on this phone until you send them. The office sees that a visit has started, not what you have written.</p>
  </main>`;
}
function screenWeek() {
  const start = addDays(MONDAY, weekDay < MONDAY ? -7 : weekDay >= addDays(MONDAY, 7) ? 7 : 0);
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const list = visitsOn(me, weekDay); let prev = null;
  return appbar('Diary', `w/c ${fmtS(start)} · ${ENG[me].name}`, false, `<div class="wknav"><button class="iconbtn" data-act="week" data-d="-7" type="button" aria-label="Previous week">‹</button><button class="iconbtn" data-act="week" data-d="7" type="button" aria-label="Next week">›</button></div>`) + `<main class="screen">
    <div class="days">${days.map(d => { const n = visitsOn(me, d).length; const on = dayDiff(d, weekDay) === 0; const today = dayDiff(d, TODAY) === 0; return `<button class="day ${on ? 'on' : ''} ${today ? 'today' : ''}" data-act="day" data-iso="${toISO(d)}" type="button"><span>${DAY[d.getDay()]}</span><b>${d.getDate()}</b><i>${n ? '●'.repeat(Math.min(n, 3)) : ''}</i></button>`; }).join('')}</div>
    <div class="sec-h">${longDate(weekDay)}${dayDiff(weekDay, TODAY) === 0 ? ' · today' : ''}</div>
    <div class="vlist">${list.map(v => { const h = visitCard(v, prev); prev = v.building; return h; }).join('') || '<div class="empty">Nothing booked this day.</div>'}</div>
    ${list.length > 1 ? `<div class="sec-h">Route</div><div class="route">${['Depot', ...list.map(v => BL[v.building].name.split(' —')[0]), 'Depot'].map((n, i, arr) => `<div class="rstop"><i></i><b>${esc(n)}</b>${i < arr.length - 1 ? `<span>${driveMin(i === 0 ? 'DEP' : list[i - 1].building, i === arr.length - 2 ? 'DEP' : list[i].building)} min</span>` : ''}</div>`).join('')}</div>` : ''}
  </main>`;
}

    ${rems.length ? `<div class="sec-h">Open remedials here</div><div class="ilist">${rems.map(r => `<a class="irow" href="#/asset/${r.assetId}"><span class="imain"><b>${esc(r.title)}</b><span>${r.id} · ${esc(AS[r.assetId].name)} · ${r.owner === me ? 'yours' : r.owner ? engName(r.owner) : 'unassigned'} · target ${fmtS(r.target)}</span></span></a>`).join('')}</div>` : ''}

function tabbar() {
  const t = route.screen === 'visit' ? (visits.find(v => v.id === route.a) && dayDiff(visits.find(v => v.id === route.a).date, TODAY) === 0 ? 'today' : 'week') : route.screen === 'building' || route.screen === 'asset' ? (visitsOn(me, TODAY).length ? 'today' : 'week') : route.screen;
  const todo = visitsOn(me, TODAY).filter(v => v.status !== 'done').length;

function screenBuildings() {
  const mine = [...new Set(visits.filter(v => v.eng === me && v.date >= addDays(TODAY, -7)).map(v => v.building))];
  const rest = BUILDINGS.map(b => b.code).filter(c => !mine.includes(c));

/* ------------------------------------------------------------- actions */
let photoN = 0;
const ACTIONS = {
  back() { const prev = stack.pop(); go(prev || '#/today', true); },

  access() { openAccess = !openAccess; render(); },
  week(d) { weekDay = addDays(weekDay, Number(d.d)); render(); },
  day(d) { weekDay = fromISO(d.iso); render(); },
  start(d) { const v = visits.find(x => x.id === d.v); v.status = 'onsite'; v.started = '08:41' === v.started ? v.started : `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`; v.items.forEach(gid => { const g = GR[gid]; g.booking = { date: v.date, eng: v.eng, onSite: true }; }); toast(`Visit started. The office can see you are at ${esc(BL[v.building].name.split(' —')[0])}.`); render(); },
  complete(d) { const v = visits.find(x => x.id === d.v); v.status = 'done'; v.finished = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`; v.items.forEach(gid => { const g = GR[gid]; if (g.booking && g.booking.onSite) g.booking = null; }); toast(`Visit complete. ${plural(v.filed.length, 'report')} sent to ${esc(CL[BL[v.building].client].contact)}.`); go('#/today'); },
  raise(d) { photoN = 0; sheetRaise(d.a || null, d.b || (d.a ? AS[d.a].building : null)); },
  photo(d, el) { photoN++; const n = el.closest('form').querySelector('[data-phn]'); n.textContent = `${plural(photoN, 'photo')} attached`; el.parentNode.insertBefore(Object.assign(document.createElement('span'), { className: 'ph thumb', textContent: `IMG ${photoN}` }), n); },
  'close-rem'(d) { const r = remedials.find(x => x.id === d.r); r.status = 'closed'; r.closed = TODAY; toast(`${r.id} closed by ${esc(ENG[me].name)}.`); render(); },
  report(d) { const e = events.find(x => x.id === d.id); if (e) sheetReport(e); },
  planned(d) { toast(`${esc(d.what)} is outside this prototype.`); },
  'dlg-close'() { closeDlg(); },
};
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (a && !e.defaultPrevented) { e.preventDefault(); if (a.dataset.act === 'dlg-close') closeDlg(); go(a.getAttribute('href')); return; }
  const t = e.target.closest('[data-act]'); if (t && t.tagName !== 'SELECT') { const f = ACTIONS[t.dataset.act]; if (f) f(t.dataset, t); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'switch') { me = t.value; openAccess = false; toast(`Viewing as ${esc(ENG[me].full)}.`); go('#/today'); }
  if (t.name === 'result' && t.form) { const f = t.form.querySelector('[data-remfield]'); if (f) f.hidden = t.value !== 'fault'; const n = t.form.querySelector('[name=notes]'); const g = GR[t.form.dataset.g]; if (n && g) n.value = findings(g.cat, t.value === 'fault'); }

document.addEventListener('input', e => { if (e.target.id === 'bq') { bSearch = e.target.value; render(); const q = document.getElementById('bq'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } } });
dlg.addEventListener('submit', e => {

  if (f.dataset.form === 'raise') {
    const a = AS[fd.get('asset')]; const id = `REM-${pad3(++remSeq)}`; const r = { id, assetId: a.id, title: fd.get('title'), raised: TODAY, owner: null, target: addDays(TODAY, 28), status: 'open', closed: null }; remedials.push(r); a.remedials = a.remedials || []; a.remedials.push(id); toast(`${id} raised against ${esc(a.name)}. The office will assign it.`);
  }

/* ================================================================= forms */
/* Service form templates, one per requirement. These are PLACEHOLDERS: the

   fail / n.a.), yn, num (with unit), choice, text, time. */
const C = (id, label, o) => Object.assign({ id, label, t: 'check', req: true }, o || {});
const N = (id, label, unit, o) => Object.assign({ id, label, t: 'num', unit, req: true }, o || {});
const Y = (id, label, o) => Object.assign({ id, label, t: 'yn', req: true }, o || {});
const T = (id, label, o) => Object.assign({ id, label, t: 'text', req: false }, o || {});
const CH = (id, label, opts, o) => Object.assign({ id, label, t: 'choice', opts, req: true }, o || {});
const FORMS = {

    { h: 'Record', f: [Y('log', 'Logbook updated on site'), N('false', 'False alarms since last visit', '', { req: false }), T('obs', 'Observations and variations')] },
  ] },
  EL: { title: 'Emergency lighting duration test', sections: [
    { h: 'Duration test', f: [{ id: 'start', label: 'Test started', t: 'time', req: true }, N('lum', 'Luminaires under test', ''), N('fail', 'Failed to hold 3 hours', ''), C('chg', 'Charging indicators normal after restoration'), C('exit', 'Exit signage legible and lit')] },
    { h: 'Record', f: [Y('log', 'Logbook updated'), T('obs', 'Failed luminaire locations and observations')] },
  ] },
  EX: { title: 'Extinguisher annual service', sections: [
    { h: 'Inventory', f: [N('n', 'Units inspected', ''), N('miss', 'Units missing from location', ''), N('cond', 'Units condemned or replaced', '')] },
    { h: 'Condition', f: [C('press', 'Pressure gauges / weights within limits'), C('hose', 'Hoses, nozzles and pins'), C('seal', 'Tamper seals intact'), C('tag', 'Service tags dated'), C('sign', 'Signage and brackets')] },
    { h: 'Record', f: [T('obs', 'Observations')] },

  FD: { title: 'Fire door quarterly check', sections: [

    { h: 'Condition', f: [C('gap', 'Gaps within 3–4 mm'), C('strip', 'Intumescent strips and cold smoke seals'), C('glaz', 'Glazing and beads'), C('hinge', 'Hinges — three, CE marked, secure'), C('sign', 'Signage present')] },
    { h: 'Record', f: [T('obs', 'Observations')] },

  GS: { title: 'Gas safety inspection (CP17)', sections: [

    { h: 'Installation', f: [C('flue', 'Flue integrity and termination'), C('vent', 'Ventilation adequate'), C('safe', 'Safety devices operate'), C('pipe', 'Pipework and supports')] },
    { h: 'Classification', f: [CH('class', 'Appliance classification', ['Safe to use', 'At Risk (AR)', 'Immediately Dangerous (ID)']), Y('notice', 'Warning notice issued', { req: false }), T('obs', 'Observations')] },
  ] },
  EI: { title: 'Periodic inspection (EICR)', sections: [
    { h: 'Scope', f: [N('boards', 'Distribution boards inspected', ''), N('circ', 'Circuits tested', ''), CH('samp', 'Sampling', ['100%', '50%', '25%'])] },
    { h: 'Results', f: [C('zs', 'Earth fault loop impedance within limits'), C('rcd', 'RCD trip times within limits'), N('c1', 'C1 observations', ''), N('c2', 'C2 observations', ''), N('c3', 'C3 observations', ''), Y('sat', 'Installation satisfactory for continued use')] },
    { h: 'Record', f: [T('obs', 'Observations')] },
  ] },
  WH: { title: 'Legionella risk assessment review', sections: [
    { h: 'Storage', f: [C('tank', 'Tank condition, lid and insect screen'), N('cold', 'Cold water storage temperature', '°C'), N('flow', 'Calorifier flow temperature', '°C'), N('ret', 'Calorifier return temperature', '°C')] },
    { h: 'Outlets', f: [C('coldout', 'Sentinel cold outlets below 20 °C'), C('hotout', 'Sentinel hot outlets above 50 °C within a minute'), N('dead', 'Dead legs identified', ''), Y('disinf', 'Disinfection recommended')] },
    { h: 'Record', f: [Y('scheme', 'Written scheme reviewed with duty holder'), T('obs', 'Observations')] },
  ] },
  LF: { title: 'Thorough examination (LOLER)', sections: [
    { h: 'Examination', f: [C('gear', 'Safety gear and overspeed governor'), C('doors', 'Doors, locks and protection devices'), C('ropes', 'Ropes / belts and terminations'), C('brake', 'Brake and machine'), C('pit', 'Pit, car top and machine room')] },
    { h: 'Outcome', f: [Y('unsafe', 'Defects affecting safe operation'), N('within', 'Repairs required within', 'days', { req: false }), T('obs', 'Defects and observations')] },
  ] },
  SC: { title: 'Smoke control annual service', sections: [
    { h: 'Operation', f: [C('alarm', 'Opens on fire alarm signal'), C('man', 'Opens and closes on manual control'), C('reset', 'Resets and holds closed'), C('seal', 'Weather seals and frame')] },
    { h: 'Record', f: [CH('act', 'Actuator condition', ['Good', 'Serviceable — monitor', 'Replace']), T('obs', 'Observations')] },
  ] },
  LP: { title: 'Lightning protection annual test', sections: [
    { h: 'Testing', f: [N('pts', 'Test points tested', ''), N('ohm', 'Highest earth resistance', 'Ω'), C('cont', 'Continuity of conductors'), C('joint', 'Joints, clamps and fixings')] },
    { h: 'Record', f: [T('obs', 'Observations')] },
  ] },
  AC: { title: 'F-gas leak check', sections: [
    { h: 'System', f: [N('kg', 'Refrigerant charge', 'kg'), CH('method', 'Leak detection method', ['Electronic detector', 'Bubble test', 'UV dye']), Y('leak', 'Leak found'), C('label', 'F-gas label present and legible')] },
    { h: 'Record', f: [Y('log', 'F-gas log updated'), T('obs', 'Observations')] },
  ] },
};
const drafts = {};
const formFor = g => FORMS[g.cat] || { title: `${CATS[g.cat].req}`, sections: [{ h: 'Inspection', f: [C('vis', 'Visual inspection'), C('func', 'Functional test'), T('obs', 'Observations')] }] };
const allFields = g => formFor(g).sections.flatMap(s => s.f);
const draftOf = g => drafts[g.id];
function progress(g) { const d = draftOf(g); const req = allFields(g).filter(f => f.req); const done = d ? req.filter(f => d.a[f.id] != null && d.a[f.id] !== '').length : 0; return { done, total: req.length, pct: req.length ? Math.round(100 * done / req.length) : 0, signed: !!(d && d.signed), photos: d ? d.photos : 0 }; }
const isDraft = g => !!draftOf(g);
function screenForm(v, g) {
  const b = BL[g.building]; const cat = CATS[g.cat]; const form = formFor(g); const d = drafts[g.id] || (drafts[g.id] = { a: {}, photos: 0, signed: false, started: `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}` }); const p = progress(g);
  const field = f => {
    const val = d.a[f.id];
    const seg = (opts) => `<div class="seg s${opts.length}">${opts.map(o => `<label><input type="radio" name="${f.id}" value="${o.v}" data-f="${f.id}" ${val === o.v ? 'checked' : ''}><span class="${o.c || ''}">${o.l}</span></label>`).join('')}</div>`;
    let ctl;
    if (f.t === 'check') ctl = seg([{ v: 'pass', l: 'Pass', c: 'okc' }, { v: 'fail', l: 'Fail', c: 'late' }, { v: 'na', l: 'N/A', c: 'fine' }]);
    else if (f.t === 'yn') ctl = seg([{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }]);
    else if (f.t === 'num') ctl = `<div class="numf"><input type="number" inputmode="decimal" step="any" data-f="${f.id}" value="${val != null ? esc(val) : ''}" placeholder="—">${f.unit ? `<span>${esc(f.unit)}</span>` : ''}</div>`;
    else if (f.t === 'time') ctl = `<input type="time" data-f="${f.id}" value="${esc(val || '')}">`;
    else if (f.t === 'choice') ctl = `<select data-f="${f.id}"><option value="">Select…</option>${f.opts.map(o => `<option ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else ctl = `<textarea data-f="${f.id}" placeholder="Optional">${esc(val || '')}</textarea>`;
    return `<div class="ff ${f.req ? 'req' : ''}"><label>${esc(f.label)}${f.req ? '' : ' <em>optional</em>'}</label>${ctl}</div>`;
  };
  return appbar(form.title, `${esc(g.label)} · ${esc(b.name.split(' —')[0])}`, true, `<span class="tag tag-gold">Draft</span>`) + `<main class="screen" data-formscreen>
    <div class="note warn"><span><b>Placeholder form.</b> Sections and fields are a first draft against ${esc(cat.std)}. Leodis's actual ${esc(form.title.toLowerCase())} form replaces this.</span></div>
    <dl class="kv" style="margin-top:12px;"><div><dt>Covers</dt><dd>${g.assetIds.length > 1 ? `${g.assetIds.length} ${cat.unit}s · ${esc(AS[g.assetIds[0]].loc)} and others` : `${esc(AS[g.assetIds[0]].name)} · ${esc(AS[g.assetIds[0]].make)} · ${esc(AS[g.assetIds[0]].loc)}`}</dd></div><div><dt>Started</dt><dd>${d.started} · ${esc(ENG[me].full)}${v ? ` · visit ${v.id}` : ''}</dd></div></dl>
    ${form.sections.map((s, i) => `<div class="sec-h">${i + 1}. ${esc(s.h)}</div><div class="fsec">${s.f.map(field).join('')}</div>`).join('')}
    <div class="sec-h">${form.sections.length + 1}. Evidence</div>
    <div class="fsec"><div class="ff"><label>Photos</label><div class="photos"><button type="button" class="ph" data-act="fphoto" data-g="${g.id}">＋<span>Add</span></button>${Array.from({ length: d.photos }, (_, i) => `<span class="ph thumb">IMG ${i + 1}</span>`).join('')}</div></div>
      <div class="ff req"><label>Signature</label>${d.signed ? `<div class="sig-line signed">✓ Signed ${esc(ENG[me].full)} · ${fmt(TODAY)} · on site</div>` : `<button type="button" class="btn btn-q wide" data-act="fsign" data-g="${g.id}">Sign as ${esc(ENG[me].full)}</button>`}</div></div>
    <div class="stick fstick">
      <div class="prog"><div class="progbar"><i style="width:${p.pct}%"></i></div><span data-progtext>${p.done} of ${p.total} required answered${p.signed ? ' · signed' : ' · not signed'}</span></div>
      <div class="btnpair"><button class="btn btn-q" data-act="fsave" data-g="${g.id}" data-v="${v ? v.id : ''}" type="button">Save draft</button><button class="btn" data-act="fsend" data-g="${g.id}" data-v="${v ? v.id : ''}" type="button" ${p.done < p.total || !p.signed ? 'disabled' : ''}>Send report</button></div>
    </div>
  </main>`;
}
function composeNotes(g) {
  const d = draftOf(g); const fields = allFields(g); const fails = fields.filter(f => f.t === 'check' && d.a[f.id] === 'fail').map(f => f.label);
  const bad = fields.filter(f => (f.t === 'yn' && ((f.id === 'unsafe' || f.id === 'leak' || f.id === 'disinf') ? d.a[f.id] === 'yes' : (f.id === 'sat' && d.a[f.id] === 'no'))) || (f.t === 'choice' && /At Risk|Immediately|Replace|remains/.test(d.a[f.id] || ''))).map(f => `${f.label}: ${d.a[f.id]}`);
  const nums = fields.filter(f => f.t === 'num' && d.a[f.id] !== undefined && d.a[f.id] !== '').map(f => `${f.label.toLowerCase()} ${d.a[f.id]}${f.unit ? ' ' + f.unit : ''}`);
  const fault = fails.length > 0 || bad.length > 0 || Number(d.a.fail || 0) > 0 || Number(d.a.c1 || 0) + Number(d.a.c2 || 0) > 0;
  const parts = [];
  if (fails.length) parts.push(`Failed: ${fails.join('; ')}.`); if (bad.length) parts.push(bad.join('. ') + '.');
  if (Number(d.a.fail || 0) > 0) parts.push(`${d.a.fail} failed${d.a.failwhich ? ` (${d.a.failwhich})` : ''}.`);
  if (!fault) parts.push(findings(g.cat, false)); if (nums.length) parts.push(`Readings: ${nums.join(', ')}.`); if (d.a.obs) parts.push(d.a.obs);
  return { fault, notes: parts.join(' '), remTitle: fails[0] ? `${fails[0]} — failed at ${CATS[g.cat].req.toLowerCase()}` : bad[0] || (Number(d.a.fail || 0) > 0 ? `${d.a.fail} ${CATS[g.cat].unit}s failed — ${d.a.failwhich || 'see report'}` : `Fault found at ${CATS[g.cat].req.toLowerCase()}`) };
}
function updateFormFooter(g) { const p = progress(g); const t = document.querySelector('[data-progtext]'); if (t) t.textContent = `${p.done} of ${p.total} required answered${p.signed ? ' · signed' : ' · not signed'}`; const bar = document.querySelector('.progbar i'); if (bar) bar.style.width = p.pct + '%'; const send = document.querySelector('[data-act=fsend]'); if (send) send.disabled = p.done < p.total || !p.signed; }
document.addEventListener('change', e => { const t = e.target; const fid = t.dataset.f; if (!fid || !route.b) return; const g = GR[route.b]; if (!g || !drafts[g.id]) return; drafts[g.id].a[fid] = t.value; updateFormFooter(g); });
document.addEventListener('input', e => { const t = e.target; const fid = t.dataset.f; if (!fid || !route.b || t.tagName === 'SELECT') return; const g = GR[route.b]; if (!g || !drafts[g.id]) return; drafts[g.id].a[fid] = t.value; updateFormFooter(g); });
Object.assign(ACTIONS, {
  form(d) { go(`#/form/${d.v || '-'}/${d.g}`); },
  fphoto(d, el) { const dr = drafts[d.g]; dr.photos++; el.parentNode.appendChild(Object.assign(document.createElement('span'), { className: 'ph thumb', textContent: `IMG ${dr.photos}` })); },
  fsign(d) { drafts[d.g].signed = true; render(); },
  fsave(d) { toast('Draft saved on this phone. It is not sent until you send it.'); go(d.v ? `#/visit/${d.v}` : `#/asset/${GR[d.g].assetIds[0]}`); },
  fsend(d) {
    const g = GR[d.g]; const v = visits.find(x => x.id === d.v) || null; const c = composeNotes(g);
    const ev = fileEvent(g, TODAY, me, c.fault ? 'fault' : 'pass', c.notes); if (v) v.filed.push(ev.id);
    if (c.fault) { const id = `REM-${pad3(++remSeq)}`; const r = { id, assetId: g.assetIds[0], title: c.remTitle, raised: TODAY, owner: null, target: addDays(TODAY, 28), status: 'open', closed: null }; remedials.push(r); const a = AS[r.assetId]; a.remedials = a.remedials || []; a.remedials.push(id); toast(`Sent <span class="ref">${ev.id}</span> with a fault. ${id} raised for the office to assign.`); }
    else toast(`Sent <span class="ref">${ev.id}</span> · next ${esc(CATS[g.cat].req.toLowerCase())} due ${fmt(addMonths(TODAY, CATS[g.cat].months))}.`);
    delete drafts[g.id]; go(v ? `#/visit/${v.id}` : `#/asset/${g.assetIds[0]}`);
  },
});

/* -------------------------------------------------------------- router */
function parse(h) { cur = h || ''; const p = cur.replace(/^#\/?/, '').split('/').filter(Boolean); route = { screen: p[0] || 'today', a: p[1] || null, b: p[2] || null }; }
const stack = [];
function go(h, isBack) { openAccess = false; if (!isBack && cur && cur !== h) { stack.push(cur); if (stack.length > 40) stack.shift(); } try { if (location.hash !== h) history.pushState(null, '', h); } catch (err) { } parse(h); render(); }
function render() {
  const s = route.screen; let html;
  if (s === 'form' && GR[route.b]) html = screenForm(visits.find(v => v.id === route.a) || null, GR[route.b]);
  else if (s === 'visit' && visits.find(v => v.id === route.a)) html = screenVisit(visits.find(v => v.id === route.a));
  else if (s === 'building' && BL[route.a]) html = screenBuilding(BL[route.a]);
  else if (s === 'asset' && AS[route.a]) html = screenAsset(AS[route.a]);
  else if (s === 'week') html = screenWeek();
  else if (s === 'buildings') html = screenBuildings();
  else if (s === 'me') html = screenMe();
  else html = screenToday();
  const ph = document.getElementById('phone'); const sc = ph.querySelector('.screen'); const top = sc ? sc.scrollTop : 0;
  ph.innerHTML = html + tabbar();
  if (sc && ['building'].includes(s)) ph.querySelector('.screen').scrollTop = top;
}
window.addEventListener('popstate', () => { if (location.hash !== cur) { parse(location.hash); render(); } });
window.addEventListener('hashchange', () => { if (location.hash !== cur) { parse(location.hash); render(); } });
go(location.hash && location.hash.startsWith('#/') ? location.hash : '#/today');
})();
