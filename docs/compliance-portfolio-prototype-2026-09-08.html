<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance Portfolio Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Relay · Leodis Compliance Management · portfolio browser prototype.
   Same tokens as the concept document. Everything on screen is generated from
   an invented data model in the script below; nothing is wired to the app. */
:root {
  color-scheme: light;
  --ground: #eeede9; --sunken: #e4e3de; --panel: #f8f7f3; --panel-2: #efeeea; --panel-3: #e3e2dd;
  --line: #d6d7d3; --line-2: #c3c6c4;
  --text: #25282a; --text-2: #5b5f60; --text-3: #767a7b;
  --aqua: #267c76; --aqua-ink: #ffffff; --aqua-wash: rgba(38,124,118,.09);
  --gold: #816321; --gold-ink: #ffffff; --gold-wash: rgba(129,99,33,.09);
  --alert: #a83c22; --alert-wash: rgba(168,60,34,.09);
  --caution: #7d5a12; --caution-wash: rgba(125,90,18,.11);
  --ok: #2b6b48; --ok-wash: rgba(43,107,72,.10);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --r: 2px;
  --sans: "Archivo", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #202224; --sunken: #1a1c1e; --panel: #282b2d; --panel-2: #2e3134; --panel-3: #363a3d;
    --line: #3a3e41; --line-2: #484c4e;
    --text: #f0efeb; --text-2: #b5b7b6; --text-3: #868a8b;
    --aqua: #77c7bf; --aqua-ink: #16201f; --aqua-wash: rgba(119,199,191,.10);
    --gold: #ccb071; --gold-ink: #202224; --gold-wash: rgba(204,176,113,.10);
    --alert: #e2705a; --alert-wash: rgba(226,112,90,.11);
    --caution: #dda94f; --caution-wash: rgba(221,169,79,.11);
    --ok: #63b78d; --ok-wash: rgba(99,183,141,.11);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #202224; --sunken: #1a1c1e; --panel: #282b2d; --panel-2: #2e3134; --panel-3: #363a3d;
  --line: #3a3e41; --line-2: #484c4e;
  --text: #f0efeb; --text-2: #b5b7b6; --text-3: #868a8b;
  --aqua: #77c7bf; --aqua-ink: #16201f; --aqua-wash: rgba(119,199,191,.10);
  --gold: #ccb071; --gold-ink: #202224; --gold-wash: rgba(204,176,113,.10);
  --alert: #e2705a; --alert-wash: rgba(226,112,90,.11);
  --caution: #dda94f; --caution-wash: rgba(221,169,79,.11);
  --ok: #63b78d; --ok-wash: rgba(99,183,141,.11);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden auto; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--aqua); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

#app { height: 100vh; min-width: 1240px; display: flex; flex-direction: column; }

/* ---- Chrome ---- */
.topbar { flex: none; display: flex; align-items: center; gap: var(--s5); background: var(--panel); border-bottom: 1px solid var(--line-2); padding: 0 var(--s5); height: 56px; position: relative; z-index: 5; }
.logo { display: flex; align-items: baseline; gap: var(--s3); }
.logo b { font-size: 17px; font-weight: 500; letter-spacing: .12em; }
.logo span { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--aqua); border-left: 1px solid var(--line-2); padding-left: var(--s3); }
.search { flex: 1; max-width: 440px; position: relative; }
.search input { width: 100%; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s2) var(--s3); color: var(--text); font: inherit; font-size: 13px; }
.search input::placeholder { color: var(--text-3); }
.search kbd { position: absolute; right: 10px; top: 8px; font-family: var(--mono); font-size: 10px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 2px; padding: 1px 5px; pointer-events: none; }
.results { position: absolute; top: 40px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 8px 24px rgba(0,0,0,.12); max-height: 380px; overflow: auto; }
.results a { display: flex; gap: var(--s3); align-items: baseline; padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); font-size: 13px; }
.results a:last-child { border-bottom: 0; }
.results a:hover { background: var(--aqua-wash); }
.results .ref { width: 130px; flex: none; }
.results .k { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; }
.results .none { padding: var(--s3); color: var(--text-3); font-size: 13px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: var(--s4); }
.whoami { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--text-2); }
.whoami em { font-style: normal; color: var(--aqua); }
.bell { font-family: var(--mono); font-size: 11px; color: var(--text-2); letter-spacing: .08em; background: none; border: 1px solid transparent; padding: 4px 8px; border-radius: var(--r); }
.bell:hover { border-color: var(--line-2); }
.bell b { color: var(--alert); font-weight: 500; }
.bell.quiet b { color: var(--ok); }
.tbtn { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); background: none; border: 0; padding: 4px 6px; }
.tbtn:hover { color: var(--text); }
.attn-pop { position: absolute; right: 24px; top: 56px; width: 420px; background: var(--panel); border: 1px solid var(--alert); border-top: 0; border-left-width: 3px; box-shadow: 0 12px 28px rgba(0,0,0,.14); z-index: 6; }
.attn-pop .mini b { color: var(--text); font-weight: 500; font-size: 13px; }
.attn-pop .mini .rowsub { margin-top: 2px; }

.hnav { flex: none; display: flex; background: var(--panel); border-bottom: 1px solid var(--line-2); padding: 0 var(--s5); }
.hnav a { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .11em; color: var(--text-3); padding: var(--s3) var(--s4); border-bottom: 2px solid transparent; display: flex; align-items: center; gap: var(--s2); }
.hnav a:hover { color: var(--text); }
.hnav a.on { color: var(--text); border-bottom-color: var(--aqua); }
.hnav a i { font-style: normal; font-size: 10px; color: var(--text-3); background: var(--panel-2); border-radius: 8px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.hnav a.on i { background: var(--aqua-wash); color: var(--aqua); }
.hnav a i.warn { color: var(--alert); background: var(--alert-wash); }

/* ---- Views ---- */
.view { flex: 1; min-height: 0; overflow: auto; padding: var(--s5); display: flex; flex-direction: column; gap: var(--s5); }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--s4); }
.pagehead h3 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.pagehead p { margin: var(--s1) 0 0; font-size: 13px; color: var(--text-2); }
.actions { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
.btn { font-family: var(--mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; background: var(--gold); color: var(--gold-ink); border: 1px solid var(--gold); border-radius: var(--r); padding: var(--s2) var(--s4); white-space: nowrap; }
.btn:hover { filter: brightness(1.08); }
.btn-q { background: transparent; color: var(--text-2); border-color: var(--line-2); }
.btn-q:hover { color: var(--aqua); border-color: var(--aqua); filter: none; }
.btn-sm { padding: 5px var(--s3); font-size: 10px; }
.btn[disabled] { opacity: .5; cursor: default; filter: none; }
.drop::after { content: " ▾"; opacity: .7; }
.panel { background: var(--panel); border: 1px solid var(--line); }
.panel-head { display: flex; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
.panel-head h4 { margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .12em; color: var(--text-2); }
.panel-head .more { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--aqua); letter-spacing: .06em; }
.panel-foot { padding: var(--s3) var(--s4); border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); }
.tag { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; border: 1px solid; border-radius: var(--r); padding: 2px var(--s2); }
.tag::before { content: "●"; font-size: 8px; line-height: 1; }
.tag-ok { color: var(--ok); border-color: var(--ok); background: var(--ok-wash); }
.tag-alert { color: var(--alert); border-color: var(--alert); background: var(--alert-wash); }
.tag-alert::before { content: "▲"; }
.tag-caution { color: var(--caution); border-color: var(--caution); background: var(--caution-wash); }
.tag-caution::before { content: "◆"; }
.tag-quiet { color: var(--text-3); border-color: var(--line-2); background: transparent; }
.tag-quiet::before { content: "○"; }
.tag-aqua { color: var(--aqua); border-color: var(--aqua); background: var(--aqua-wash); }
.tag-aqua::before { content: "■"; }
.tag-gold { color: var(--gold); border-color: var(--gold); background: var(--gold-wash); }
.tag-gold::before { content: "◪"; }
.ref { font-family: var(--mono); font-size: 12px; color: var(--aqua); letter-spacing: .02em; font-weight: 500; }
a.ref:hover { text-decoration: underline; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.due { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.due b { font-weight: 500; }
.late { color: var(--alert); } .soon { color: var(--caution); } .fine { color: var(--text-3); } .okc { color: var(--ok); }
table.reg { width: 100%; border-collapse: collapse; }
table.reg th { text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .11em; color: var(--text-3); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line-2); background: var(--panel-2); white-space: nowrap; }
table.reg td { padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); vertical-align: top; font-size: 13px; }
table.reg tr:last-child td { border-bottom: 0; }
table.reg tbody tr:hover { background: var(--aqua-wash); }
table.reg tr.sel { background: var(--aqua-wash); box-shadow: inset 2px 0 0 var(--aqua); }
table.reg.tight td, table.reg.tight th { padding: var(--s2) var(--s3); font-size: 12px; }
table.reg tr.clickable { cursor: pointer; }
.rowtitle { font-weight: 500; font-size: 14px; }
.rowsub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.rowsub .sep { color: var(--line-2); margin: 0 6px; }
.client { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--text-3); text-transform: uppercase; }
.mini { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); align-items: flex-start; }
.mini:last-child { border-bottom: 0; }
.mini-b { flex: 1; min-width: 0; }
.mini-b p { margin: 0; font-size: 13px; }
.age { font-family: var(--mono); font-size: 11px; color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.filters { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; padding: var(--s3) var(--s4); background: var(--panel-2); border: 1px solid var(--line); }
.chip { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; border: 1px solid var(--line-2); border-radius: var(--r); padding: 3px var(--s3); color: var(--text-2); background: var(--panel); white-space: nowrap; cursor: pointer; }
.chip:hover { border-color: var(--aqua); }
.chip.on { border-color: var(--aqua); color: var(--aqua); background: var(--aqua-wash); }
.chip.warn { color: var(--alert); border-color: var(--alert); }
.chip.warn.on { background: var(--alert-wash); }
.filters .spacer { margin-left: auto; }
.filters select, .f select, .f input, .f textarea { font: inherit; font-size: 13px; background: var(--panel); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--r); padding: 4px 8px; }
.cbar { display: flex; height: 6px; width: 100%; background: var(--panel-3); border-radius: 1px; overflow: hidden; }
.cbar i { display: block; height: 100%; }
.cbar .ok { background: var(--ok); } .cbar .soon { background: var(--caution); } .cbar .late { background: var(--alert); } .cbar .none { background: var(--line-2); }
.cbar-key { display: flex; gap: var(--s4); font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--text-3); text-transform: uppercase; flex-wrap: wrap; }
.cbar-key span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: -1px; }
.cbar-key .k-ok::before { background: var(--ok); } .cbar-key .k-soon::before { background: var(--caution); } .cbar-key .k-late::before { background: var(--alert); } .cbar-key .k-none::before { background: var(--line-2); }
.figs { display: grid; grid-template-columns: repeat(5, 1fr); border: 1px solid var(--line); background: var(--panel); }
.figs div { padding: var(--s4); border-right: 1px solid var(--line); }
.figs div:last-child { border-right: 0; }
.figs dt { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .11em; color: var(--text-3); }
.figs dd { margin: var(--s2) 0 0; font-family: var(--mono); font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.figs dd small { font-size: 12px; color: var(--text-3); letter-spacing: 0; margin-left: 6px; font-family: var(--sans); }

/* ---- Portfolio columns ---- */
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 224px 300px 372px 1fr; }
.col { min-height: 0; overflow-y: auto; border-right: 1px solid var(--line-2); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
.col:last-child { border-right: 0; background: var(--sunken); }
.col-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: baseline; gap: var(--s2); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line-2); background: var(--panel-2); }
.col-head h4 { margin: 0; font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .12em; color: var(--aqua); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col-head i { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-left: auto; white-space: nowrap; }
.col:last-child .col-head { background: var(--panel); }
.item { display: block; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); border-left: 2px solid transparent; }
.item:hover { background: var(--sunken); }
.item.on { background: var(--aqua-wash); border-left-color: var(--aqua); }
.item-top { display: flex; align-items: baseline; gap: var(--s2); }
.item-top .rowtitle { font-size: 13px; flex: 1; min-width: 0; }
.item-top .arrow { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
.item.on .arrow { color: var(--aqua); }
.item .cbar { margin-top: var(--s2); }
.item .meta { display: flex; gap: var(--s3); margin-top: var(--s1); font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--text-3); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.grp { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); padding: var(--s3) var(--s4) var(--s1); border-bottom: 1px solid var(--line); display: flex; gap: var(--s2); }
.grp i { font-style: normal; margin-left: auto; }
.arow { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4); border-bottom: 1px solid var(--line); border-left: 2px solid transparent; }
.arow:hover { background: var(--sunken); }
.arow.on { background: var(--aqua-wash); border-left-color: var(--aqua); }
.arow .ref { font-size: 11px; width: 122px; flex: none; }
.arow .nm { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arow .tag { flex: none; }
.empty { padding: var(--s6) var(--s5); color: var(--text-3); font-size: 13px; text-align: center; }
.colpad { padding: var(--s4); display: flex; flex-direction: column; gap: var(--s4); }
.colpad.sticky-foot { margin-top: auto; border-top: 1px solid var(--line); padding: var(--s3) var(--s4); }

/* ---- Sheet ---- */
.sheet { background: var(--panel); border: 1px solid var(--line); padding: var(--s4); }
.sheet-title { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s4); border-bottom: 1px solid var(--line-2); padding-bottom: var(--s3); }
.sheet-title h4 { margin: 6px 0 var(--s1); font-size: 18px; font-weight: 500; letter-spacing: -.015em; }
.crumbs { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: .03em; }
.crumbs a { font-weight: 500; color: var(--aqua); }
.crumbs a:hover { text-decoration: underline; }
.crumbs span { margin: 0 6px; color: var(--line-2); }
.tb { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); margin-top: var(--s3); }
.tb div { padding: var(--s3) var(--s4); border-right: 1px solid var(--line); }
.tb div:last-child { border-right: 0; }
.tb dt { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
.tb dd { margin: var(--s1) 0 0; font-size: 13px; }
.tb.two { grid-template-columns: 1fr 1fr; }
.tb.two div:nth-child(2n) { border-right: 0; }
.tb.two div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
.tb.two.single div:nth-child(-n+2) { border-bottom: 0; }
.sec-h { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); margin: var(--s5) 0 var(--s2); display: flex; align-items: center; gap: var(--s3); }
.sec-h a, .sec-h button { margin-left: auto; color: var(--aqua); letter-spacing: .06em; background: none; border: 0; font: inherit; }
.dueblock { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--line); margin-top: var(--s4); }
.dueblock > div { padding: var(--s3) var(--s4); border-right: 1px solid var(--line); }
.dueblock > div:last-child { border-right: 0; }
.dueblock dt { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
.dueblock dd { margin: var(--s1) 0 0; font-family: var(--mono); font-size: 18px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.dueblock dd.txt { font-family: var(--sans); font-size: 13px; }
.dueblock dd small { display: block; font-family: var(--sans); font-size: 12px; color: var(--text-3); letter-spacing: 0; margin-top: 2px; }
.hist { display: flex; gap: var(--s4); padding: var(--s3) 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
.hist:last-child { border-bottom: 0; }
.hist .d { font-family: var(--mono); font-size: 12px; color: var(--text-2); width: 92px; flex: none; font-variant-numeric: tabular-nums; }
.hist .b { flex: 1; min-width: 0; }
.hist .b p { margin: 0; font-size: 13px; }
.rmenu { border: 1px solid var(--line); background: var(--panel); }
.rmenu a, .rmenu button { display: flex; width: 100%; text-align: left; align-items: center; gap: var(--s3); padding: var(--s3) var(--s4); border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; }
.rmenu a:last-child, .rmenu button:last-child { border-bottom: 0; }
.rmenu a:hover, .rmenu button:hover { background: var(--aqua-wash); }
.rmenu .rt { flex: 1; min-width: 0; }
.rmenu .rt b { display: block; font-size: 13px; font-weight: 500; }
.rmenu .rt span { font-size: 12px; color: var(--text-3); }
.rmenu .ref { font-size: 11px; width: 118px; flex: none; }
.note { margin-top: var(--s3); padding: 10px 12px; border: 1px solid var(--line-2); border-left-width: 3px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: var(--s3); background: var(--panel-2); }
.note.warn { border-color: var(--caution); background: var(--caution-wash); }
.note.bad { border-color: var(--alert); background: var(--alert-wash); }
.note.good { border-color: var(--ok); background: var(--ok-wash); }
.note.info { border-color: var(--aqua); background: var(--aqua-wash); }
.note b { font-weight: 500; }
.menu { position: relative; }

/* ----------------------------------------------------------- remedials */
function viewRemedials() {
  const f = ['open', 'unassigned', 'closed'].includes(route.a) ? route.a : 'open';
  let list = remedials.filter(r => f === 'closed' ? r.status === 'closed' : r.status === 'open' && (f === 'open' || !r.owner));
  list = list.sort((x, y) => f === 'closed' ? y.closed - x.closed : x.target - y.target);
  const cnt = k => k === 'closed' ? remedials.filter(r => r.status === 'closed').length : k === 'unassigned' ? remedials.filter(r => r.status === 'open' && !r.owner).length : remedials.filter(r => r.status === 'open').length;
  return `<div class="view">
    <div class="pagehead"><div><h3>Remedials</h3><p>${cnt('open')} open · ${cnt('unassigned')} unassigned · ${remedials.filter(r => r.status === 'open' && dayDiff(r.target, TODAY) < 0).length} past target</p></div>

    <div class="panel"><table class="reg"><thead><tr><th>Ref</th><th>Asset</th><th>Building</th><th>Raised</th><th>Owner</th><th>Target</th><th>Status</th><th></th></tr></thead><tbody>
      ${list.length ? list.map(r => { const a = AS[r.assetId]; const td = dayDiff(r.target, TODAY); return `<tr><td><span class="ref">${r.id}</span></td><td>${aRef(a)}<div class="rowtitle" style="font-size:13px;">${esc(r.title)}</div><div class="rowsub">${esc(a.name)}</div></td><td>${thumbLine(GR[a.groupId])}</td><td class="due">${fmt(r.raised)}</td><td>${r.owner ? engName(r.owner) : '<span class="late">Unassigned</span>'}</td><td class="due">${r.status === 'closed' ? `<span class="fine">closed ${fmtS(r.closed)}</span>` : `<b class="${td < 0 ? 'late' : td <= 7 ? 'soon' : ''}">${fmtS(r.target)}</b> · ${td < 0 ? -td + 'd late' : td + 'd'}`}</td><td>${r.status === 'closed' ? '<span class="tag tag-ok">Closed</span>' : r.owner ? '<span class="tag tag-caution">Assigned</span>' : '<span class="tag tag-alert">Unassigned</span>'}</td><td>${r.status === 'closed' ? '' : `<div class="actions" style="flex-wrap:nowrap;">${r.owner ? `<button class="btn btn-q btn-sm" data-act="assign" data-r="${r.id}" type="button">Reassign</button>` : `<button class="btn btn-sm" data-act="assign" data-r="${r.id}" type="button">Assign</button>`}<button class="btn btn-q btn-sm" data-act="close-rem" data-r="${r.id}" type="button">Close</button></div>`}</td></tr>`; }).join('') : `<tr><td colspan="8" class="empty">No ${f} remedials.</td></tr>`}</tbody></table>
      <div class="panel-foot">A remedial belongs to the asset that raised it and to the report that found it. Closing one records who closed it and when; it does not alter the asset's statutory date.</div></div>
  </div>`;
}

  return openDlg(`<form method="dialog" data-form="newreport" data-g="${g.id}" data-mode="${mode || 'file'}">${dlgShell(record ? 'Enter last known record' : `File a ${cat.rtype === 'SVR' ? 'service report' : RTYPES[cat.rtype].toLowerCase()}`, `${esc(CL[g.client].name)} › ${esc(b.name)} › ${esc(g.label)}`,
    `${record ? `<div class="note warn" style="margin:0;"><span>No record is held. Entering the date of the last known ${esc(cat.req.toLowerCase())} lets the next due date be computed. Attach the certificate afterwards.</span></div>` : `<div class="note info" style="margin:0;"><span><b>${esc(cat.req)}</b> · ${esc(cat.std)} · ${s.next ? 'was due ' + fmt(s.next) : 'no previous record'}. Filing this moves the next due date to ${cat.months} months after the visit.</span></div>`}
     <div class="f-row"><div class="f"><label>${record ? 'Date of last ' + esc(cat.req.toLowerCase()) : 'Visit date'}</label><input name="date" type="date" value="${toISO(record ? addMonths(TODAY, -Math.floor(cat.months / 2)) : (g.booking && g.booking.date <= TODAY ? g.booking.date : TODAY))}" max="${toISO(TODAY)}" required></div><div class="f"><label>Engineer</label>${engSelect('eng', cat.trade, g.booking ? g.booking.eng : null)}</div></div>
     <div class="f"><label>Result</label><select name="result"><option value="pass">Satisfactory — no faults</option><option value="fault">Fault found — raise a remedial</option></select></div>
     <div class="f"><label>Findings</label><textarea name="notes">${esc(record ? 'Record entered from client paperwork; certificate to be attached.' : findings(g.cat, false))}</textarea></div>
     <div class="f" data-remfield hidden><label>Remedial title</label><input name="remtitle" placeholder="What needs doing"></div>
     <p class="rowsub" style="margin:0;">The report will be numbered in sequence for ${esc(b.name)} and sent to ${esc(CL[g.client].contact)}.</p>`,
    `<button class="btn btn-q" type="button" data-act="dlg-close">Cancel</button><button class="btn" type="submit">${record ? 'Save record' : 'File report'}</button>`)}</form>`);
}
function dlgRaise() {
  return openDlg(`<form method="dialog" data-form="raise">${dlgShell('Raise a remedial', 'Against a tracked asset',
    `<div class="f"><label>Asset</label><select name="asset">${BUILDINGS.map(b => `<optgroup label="${esc(b.name)}">${groupsOfBuilding(b.code).map(g => `<option value="${g.assetIds[0]}">${esc(g.label)} · ${g.assetIds[0]}</option>`).join('')}</optgroup>`).join('')}</select></div>
     <div class="f"><label>What needs doing</label><input name="title" required placeholder="e.g. Replace failed sounder, level 2 corridor"></div>
     <div class="f-row"><div class="f"><label>Owner</label><select name="eng"><option value="">Unassigned</option>${Object.values(ENG).map(e => `<option value="${e.id}">${esc(e.full)}</option>`).join('')}</select></div><div class="f"><label>Target</label><input name="target" type="date" value="${toISO(addDays(TODAY, 28))}" required></div></div>`,
    `<button class="btn btn-q" type="button" data-act="dlg-close">Cancel</button><button class="btn" type="submit">Raise</button>`)}</form>`);
}
function dlgReport(e) {
  const g = GR[e.groupId]; const b = BL[e.building]; const c = CL[e.client]; const cat = CATS[e.cat]; const a = AS[g.assetIds[0]];
  const rems = remedials.filter(r => g.assetIds.includes(r.assetId) && Math.abs(dayDiff(r.raised, e.date)) <= 3);
  return openDlg(`<div class="doc"><div class="doc-head"><div><div class="kick">${esc(e.type)} · Leodis Compliance Management</div><h2>${esc(g.label)}</h2><div class="rowsub"><span class="ref">${e.id}</span><span class="sep">/</span>${esc(b.name)}<span class="sep">/</span>${fmt(e.date)}</div></div><div class="actions"><button class="btn btn-q btn-sm" type="button" data-act="export" data-what="PDF of ${e.id}">Download PDF</button><button class="x" type="button" data-act="dlg-close" aria-label="Close">×</button></div></div>
    <dl class="tb" style="margin:0 0 16px;"><div><dt>Client</dt><dd>${esc(c.name)}</dd></div><div><dt>Engineer</dt><dd>${esc(ENG[e.eng].full)}${ENG[e.eng].gasSafe && e.cat === 'GS' ? `<div class="rowsub">Gas Safe ${ENG[e.eng].gasSafe}</div>` : ''}</dd></div><div><dt>Requirement</dt><dd>${esc(cat.req)}<div class="rowsub">${esc(cat.std)}</div></dd></div><div><dt>Result</dt><dd>${resultTag(e.result)}</dd></div></dl>
    <div class="sec-h" style="margin-top:0;">Assets covered · ${g.assetIds.length}</div>
    <div class="rmenu" style="max-height:160px;overflow:auto;">${g.assetIds.slice(0, 40).map(id => `<a href="${pathTo(AS[id])}" data-act="dlg-close"><span class="ref">${id}</span><div class="rt"><b>${esc(AS[id].name)}</b><span>${esc(AS[id].loc)}</span></div></a>`).join('')}${g.assetIds.length > 40 ? `<div class="empty" style="padding:8px;">and ${g.assetIds.length - 40} more</div>` : ''}</div>
    <div class="sec-h">Findings</div><p>${esc(e.notes)}</p>
    ${rems.length ? `<div class="sec-h">Remedials raised</div><div class="rmenu">${rems.map(r => `<a href="${pathTo(AS[r.assetId])}" data-act="dlg-close"><span class="ref">${r.id}</span><div class="rt"><b>${esc(r.title)}</b><span>${esc(AS[r.assetId].name)} · ${r.status === 'closed' ? 'closed ' + fmtS(r.closed) : r.owner ? 'owner ' + engName(r.owner) : 'unassigned'}</span></div></a>`).join('')}</div>` : ''}
    <div class="sec-h">Next due</div><p>${esc(cat.req)} due again by <b class="num">${fmt(addMonths(e.date, cat.months))}</b>${eventsOf(g)[0] === e ? '' : ' — superseded by a later report'}.</p>
    <div class="sig">Signed ${esc(ENG[e.eng].full)} · ${fmt(e.date)} · Sent to ${esc(c.contact)} (${esc(c.email)}) · Generated by Leodis Relay</div></div>`);
}
function dlgStatement(scope) {
  const isClient = !!scope.client; const c = CL[scope.client || BL[scope.building].client]; const b = scope.building ? BL[scope.building] : null;
  const gs = b ? groupsOfBuilding(b.code) : groupsOfClient(c.code); const r = rollup(gs);
  const rows = b ? gs.map(g => { const s = status(g); return `<tr><td>${esc(g.label)}<div class="rowsub">${esc(CATS[g.cat].req)} · ${esc(CATS[g.cat].std)}</div></td><td class="due">${fmt(g.last)}</td><td>${s.next ? fmt(s.next) : '—'}</td><td>${tag(s)}</td></tr>`; }).join('')
    : buildingsOf(c.code).map(bb => { const rb = rollup(groupsOfBuilding(bb.code)); const l = lateItems().filter(g => g.building === bb.code).length; return `<tr><td>${esc(bb.name)}<div class="rowsub">${esc(bb.kind)}</div></td><td class="num">${rb.total}</td><td class="num">${Math.round(100 * rb.ok / rb.total)}%</td><td>${l ? `<span class="tag tag-alert">${l} overdue</span>` : rb.none ? `<span class="tag tag-quiet">${rb.none} no record</span>` : rb.soon ? `<span class="tag tag-caution">${rb.soon} due</span>` : '<span class="tag tag-ok">In date</span>'}</td></tr>`; }).join('');
  return openDlg(`<div class="doc"><div class="doc-head"><div><div class="kick">Compliance statement · ${isClient ? 'portfolio' : 'building'} · prototype</div><h2>${esc(b ? b.name : c.name)}</h2><div class="rowsub">Prepared for ${esc(c.contact)}, ${esc(c.role)} · position as at ${fmt(TODAY)}</div></div><div class="actions"><button class="btn btn-q btn-sm" type="button" data-act="export" data-what="statement PDF">Download PDF</button><button class="x" type="button" data-act="dlg-close" aria-label="Close">×</button></div></div>
    <p>Of ${r.total} tracked assets, <b>${r.ok}</b> are in date, <b>${r.soon}</b> fall due within 30 days, <b>${r.late}</b> are past their statutory date and <b>${r.none}</b> have no record held. This statement summarises the register; it does not replace the individual certificates, which remain the statutory documents.</p>
    <div style="margin:12px 0;">${bar(r)}</div>
    <table class="reg tight" style="border:1px solid var(--line);"><thead><tr>${b ? '<th>Requirement</th><th>Last done</th><th>Next due</th><th>Status</th>' : '<th>Building</th><th>Assets</th><th>In date</th><th>Position</th>'}</tr></thead><tbody>${rows}</tbody></table>
    <div class="sig">Issued by Cal Say, Compliance manager · Leodis Compliance Management Ltd · ${fmt(TODAY)}</div></div>`);
}
function hubOverlay() {
  return `<div class="hub" id="hub"><div class="hub-card"><div class="hub-top"><div class="logo"><b>RELAY</b><span style="color:var(--text-3)">BY LEODIS</span></div><button class="tbtn" data-act="hub-close" type="button">Back to Compliance</button></div>
    <div class="hub-body"><h1>Select your company</h1><div class="hub-grid"><div class="mast"><strong>One<br>Leodis.</strong><small>TWO COMPANIES.<br>ONE CONNECTION.</small></div><div>
      <button class="company" type="button" data-act="hub-dev"><span><small>LEODIS</small><span class="nm">Developments<em>LIMITED</em></span></span><span class="arrow">↗</span></button>
      <button class="company aq" type="button" data-act="hub-close"><span><small>LEODIS</small><span class="nm">Compliance<br>Management<em>LIMITED</em></span></span><span class="arrow">↗</span></button></div></div></div>
    <div class="hub-foot"><span>Leodis Developments Ltd</span><span>Leodis Compliance Management Ltd</span></div></div></div>`;
}

/* -------------------------------------------------------------- toasts */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = msg; document.getElementById('toasts').appendChild(t); setTimeout(() => t.remove(), 4200); }

/* ------------------------------------------------------------- actions */
function nextRef(building, rtype) { const n = events.filter(e => e.building === building && CATS[e.cat].rtype === rtype).length + 1; return `${BL[building].client}-${building}-${rtype}-${pad3(n)}`; }
function fileReport(g, date, eng, result, notes, mode, remtitle) {
  const cat = CATS[g.cat];
  const e = { id: nextRef(g.building, cat.rtype), type: RTYPES[cat.rtype], date, eng, result, notes, assetIds: g.assetIds.slice(), groupId: g.id, cat: g.cat, building: g.building, client: g.client };
  events.push(e); if (!g.last || date > g.last) g.last = date; if (g.booking && !g.booking.onSite) g.booking = null; if (g.booking && g.booking.onSite) g.booking = null; g.notified = null;
  if (result === 'fault') { const id = `REM-${pad3(++remSeq)}`; const r = { id, assetId: g.assetIds[0], title: remtitle || `Fault found at ${cat.req.toLowerCase()} — see ${e.id}`, raised: date, owner: null, target: addDays(date, 28), status: 'open', closed: null }; remedials.push(r); const a = AS[r.assetId]; a.remedials = a.remedials || []; a.remedials.push(id); toast(`Filed <span class="ref">${e.id}</span> and raised ${id}. Sent to ${esc(CL[g.client].contact)}.`); }
  else toast(`${mode === 'record' ? 'Record saved as' : 'Filed'} <span class="ref">${e.id}</span> · next ${esc(cat.req.toLowerCase())} due ${fmt(addMonths(date, cat.months))}. Sent to ${esc(CL[g.client].contact)}.`);
}
const ACTIONS = {
  theme() { const root = document.documentElement; const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); root.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark'); },
  attn() { attnOpen = !attnOpen; render(); },
  'attn-close'() { attnOpen = false; },
  hub() { document.body.insertAdjacentHTML('beforeend', hubOverlay()); },
  'hub-close'() { const h = document.getElementById('hub'); if (h) h.remove(); },
  'hub-dev'() { toast('Leodis Developments opens the reporting workspace. It is outside this prototype.'); },
  afilter(d) { assetFilter = d.v; render(); },
  duewin(d) { dueWin = Number(d.v); render(); },
  reptype(d) { repType = d.v; render(); },
  menu(d) { menuOpen = menuOpen === d.menu ? null : d.menu; render(); },
  book(d) { menuOpen = null; dlgBook(GR[d.g], !!d.early); },
  'book-next'(d) { let pool = d.late ? lateItems() : dueItems(90).concat(lateItems()); if (d.client) pool = pool.filter(g => g.client === d.client); if (d.building) pool = pool.filter(g => g.building === d.building); pool = pool.filter(g => !g.booking).sort((x, y) => status(x).days - status(y).days); if (!pool.length) { toast('Nothing here needs booking.'); return; } dlgBook(pool[0]); },
  unbook(d) { const g = GR[d.g]; g.booking = null; toast(`Booking cancelled for ${esc(g.label)}.`); render(); },
  notify(d) { const g = GR[d.g]; g.notified = TODAY; toast(`${esc(BL[g.building].rp.split(': ')[1] || CL[g.client].contact)} notified about ${esc(g.label)} at ${esc(BL[g.building].name)}.`); render(); },
  'notify-all'() { const l = lateItems().filter(g => !g.notified); if (!l.length) { toast('Every duty holder has already been told.'); return; } l.forEach(g => g.notified = TODAY); toast(`${plural(l.length, 'duty holder')} notified.`); render(); },
  assign(d) { dlgAssign(remedials.find(r => r.id === d.r)); },
  'close-rem'(d) { const r = remedials.find(x => x.id === d.r); r.status = 'closed'; r.closed = TODAY; if (!r.owner) r.owner = 'CS'; toast(`${r.id} closed by Cal Say, ${fmt(TODAY)}.`); render(); },
  newreport(d) { menuOpen = null; dlgNewReport(GR[d.g], d.mode); },
  raise() { dlgRaise(); },
  report(d) { const e = events.find(x => x.id === d.id); if (e) dlgReport(e); },
  statement(d) { dlgStatement(d); },
  export(d) { toast(`${esc(d.what[0].toUpperCase() + d.what.slice(1))} would download here. Exports are outside this prototype.`); },
  planned(d) { menuOpen = null; toast(`${esc(d.what)} is planned, not built. Nothing was changed.`); render(); },
  'dlg-close'() { closeDlg(); },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); const go = e.target.closest('[data-go]');
  if (t && t.tagName !== 'SELECT') { const act = ACTIONS[t.dataset.act]; if (act) { if (t.tagName === 'A' && t.dataset.act === 'planned') e.preventDefault(); act(t.dataset, t); } if (t.dataset.act !== 'menu' && menuOpen && !t.closest('.menu-pop')) { menuOpen = null; } return; }
  if (go) { window.__go(go.dataset.go); return; }
  if (menuOpen && !e.target.closest('.menu')) { menuOpen = null; render(); }
  if (attnOpen && !e.target.closest('.attn-pop')) { attnOpen = false; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'dueclient') { window.__go(t.value === 'all' ? '#/due' : `#/due/${t.value}`); }
  if (t.dataset.act === 'repclient') { window.__go(t.value === 'all' ? '#/reports' : `#/reports/${t.value}`); }
  if (t.name === 'result' && t.form) { const f = t.form.querySelector('[data-remfield]'); if (f) { f.hidden = t.value !== 'fault'; const n = t.form.querySelector('[name=notes]'); const g = GR[t.form.dataset.g]; if (n && g) n.value = findings(g.cat, t.value === 'fault'); } }
});
dlg.addEventListener('submit', e => {
  const f = e.target; const fd = new FormData(f); e.preventDefault();
  if (f.dataset.form === 'book') {
    const g = GR[f.dataset.g]; const date = fromISO(fd.get('date')); const eng = fd.get('eng');
    g.booking = { date, eng, note: fd.get('note') }; const also = fd.getAll('also'); also.forEach(id => { GR[id].booking = { date, eng, note: `Same visit as ${g.label}` }; });
    toast(`Booked ${esc(ENG[eng].name)} for ${esc(BL[g.building].name)} on ${fmt(date)}${also.length ? ` · ${plural(also.length + 1, 'item')} in one visit` : ''}.`);
  } else if (f.dataset.form === 'assign') {
    const r = remedials.find(x => x.id === f.dataset.r); r.owner = fd.get('eng'); r.target = fromISO(fd.get('target')); toast(`${r.id} assigned to ${esc(ENG[r.owner].full)}, target ${fmt(r.target)}.`);
  } else if (f.dataset.form === 'newreport') {
    fileReport(GR[f.dataset.g], fromISO(fd.get('date')), fd.get('eng'), fd.get('result'), fd.get('notes'), f.dataset.mode, fd.get('remtitle'));
  } else if (f.dataset.form === 'raise') {
    const a = AS[fd.get('asset')]; const id = `REM-${pad3(++remSeq)}`; const r = { id, assetId: a.id, title: fd.get('title'), raised: TODAY, owner: fd.get('eng') || null, target: fromISO(fd.get('target')), status: 'open', closed: null }; remedials.push(r); a.remedials = a.remedials || []; a.remedials.push(id); toast(`${id} raised against ${esc(a.name)} at ${esc(BL[a.building].name)}.`);
  }
  closeDlg(); render();
});
dlg.addEventListener('close', () => { dlg.innerHTML = ''; });

/* -------------------------------------------------------------- search */
function searchResults(q) {
  q = q.trim().toLowerCase(); if (q.length < 2) return [];
  const out = [];
  CLIENTS.forEach(c => { if (c.name.toLowerCase().includes(q)) out.push({ ref: c.code, t: c.name, k: 'client', go: `#/portfolio/${c.code}` }); });
  BUILDINGS.forEach(b => { if (b.name.toLowerCase().includes(q) || b.code.toLowerCase() === q) out.push({ ref: `${b.client}-${b.code}`, t: b.name, k: 'building', go: `#/portfolio/${b.client}/${b.code}` }); });
  groups.forEach(g => { const a = AS[g.assetIds[0]]; const hay = `${g.label} ${a.id} ${a.make} ${a.loc} ${a.serial || ''} ${CATS[g.cat].label}`.toLowerCase(); if (hay.includes(q)) out.push({ ref: a.id, t: `${g.label} · ${BL[g.building].name}`, k: CATS[g.cat].label, go: pathTo(a) }); });
  if (out.length < 8) assets.forEach(a => { if (GR[a.groupId].assetIds.length > 1 && (a.id.toLowerCase().includes(q) || a.name.toLowerCase().includes(q))) out.push({ ref: a.id, t: `${a.name} · ${BL[a.building].name}`, k: 'asset', go: pathTo(a) }); });
  events.forEach(e => { if (e.id.toLowerCase().includes(q)) out.push({ ref: e.id, t: `${e.type} · ${GR[e.groupId].label}`, k: 'report', act: e.id }); });
  return out.slice(0, 10);
}
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return; const box = document.getElementById('results'); const res = searchResults(e.target.value);
  if (!e.target.value.trim()) { box.hidden = true; return; }
  box.hidden = false; box.innerHTML = res.length ? res.map(r => r.act ? `<a href="#" data-act="report" data-id="${r.act}"><span class="ref">${r.ref}</span><span>${esc(r.t)}</span><span class="k">${esc(r.k)}</span></a>` : `<a href="${r.go}"><span class="ref">${r.ref}</span><span>${esc(r.t)}</span><span class="k">${esc(r.k)}</span></a>`).join('') : `<div class="none">Nothing matches “${esc(e.target.value)}”.</div>`;
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.target.matches('input,textarea,select') && !dlg.open) { e.preventDefault(); const q = document.getElementById('q'); q.focus(); q.select(); }
  if (e.key === 'Escape') { const box = document.getElementById('results'); if (box) box.hidden = true; if (menuOpen || attnOpen) { menuOpen = null; attnOpen = false; render(); } const h = document.getElementById('hub'); if (h) h.remove(); }
});

/* -------------------------------------------------------------- router */
/* Navigation is internal state first and the URL hash second, so the prototype
   still works where the host blocks hash navigation (e.g. data: previews). */
let cur = location.hash || '';
function parse(h) { cur = h || ''; const parts = cur.replace(/^#\/?/, '').split('/').filter(Boolean); route = { tab: parts[0] || 'portfolio', a: parts[1] || null, b: parts[2] || null, c: parts[3] || null }; }
window.__go = h => go(h);
function go(h) {
  menuOpen = null; attnOpen = false;
  try { if (location.hash !== h) history.pushState(null, '', h); } catch (err) { /* host forbids URL changes; state still moves */ }
  parse(h); if (route.tab === 'portfolio' && !route.a) assetFilter = 'action'; render();
  const box = document.getElementById('results'); if (box) box.hidden = true;
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]'); if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
  e.preventDefault(); if (a.dataset.act === 'attn-close' || a.dataset.act === 'dlg-close') { attnOpen = false; closeDlg(); } go(a.getAttribute('href'));
});
const VIEWS = { portfolio: viewPortfolio, due: viewDue, overdue: viewOverdue, remedials: viewRemedials, reports: viewReports, engineers: viewEngineers, admin: viewAdmin };
function render() {
  const app = document.getElementById('app');
  const scrolls = {}; app.querySelectorAll('[data-col],.view').forEach(el => { scrolls[el.dataset.col || 'view'] = el.scrollTop; });
  const q = document.getElementById('q'); const qv = q ? q.value : ''; const qfocus = q && document.activeElement === q;
  const view = (VIEWS[route.tab] || viewPortfolio)();
  app.innerHTML = topbar() + hnav() + view;
  app.querySelectorAll('[data-col],.view').forEach(el => { const k = el.dataset.col || 'view'; if (scrolls[k]) el.scrollTop = scrolls[k]; });
  const q2 = document.getElementById('q'); if (q2) { q2.value = qv; if (qfocus) q2.focus(); }
  const sel = app.querySelector('.arow.on, .item.on'); if (sel && !scrolls[sel.closest('[data-col]').dataset.col]) sel.scrollIntoView({ block: 'nearest' });
}
window.addEventListener('hashchange', () => { if (location.hash !== cur) go(location.hash); });
window.addEventListener('popstate', () => { if (location.hash !== cur) { parse(location.hash); render(); } });
go(location.hash && location.hash.startsWith('#/') ? location.hash : '#/portfolio/AVH/ARC/AVH-ARC-FA-01');
})();

</script>
